<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live PV-Forecast Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f3f5;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            position: relative;
            min-height: 52px;
            padding-top: 8px;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 5px;
            padding-right: 56px;
        }
        .header-actions {
            position: absolute;
            right: 0;
            top: 0;
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(44, 62, 80, 0.05);
            border: 1px solid rgba(44, 62, 80, 0.08);
            border-radius: 999px;
            padding: 4px;
            box-shadow: 0 2px 8px rgba(44, 62, 80, 0.08);
        }
        #language-switch,
        #settings-button {
            background: #2c3e50;
            color: white;
            border: none;
            border-radius: 999px;
            padding: 6px 10px;
            cursor: pointer;
            font-weight: bold;
            line-height: 1.2;
            box-shadow: 0 2px 6px rgba(44, 62, 80, 0.15);
        }
        #language-switch {
            min-width: 52px;
        }
        .settings-menu {
            position: absolute;
            right: 0;
            top: calc(100% + 8px);
            display: none;
            min-width: 210px;
            background: white;
            border: 1px solid #dfe6e9;
            border-radius: 10px;
            box-shadow: 0 10px 24px rgba(44, 62, 80, 0.18);
            padding: 8px;
            z-index: 50;
        }
        .settings-menu.open {
            display: block;
        }
        .settings-menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            background: #f8f9fa;
            color: #2c3e50;
            border: none;
            border-radius: 8px;
            padding: 10px 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95em;
            text-align: left;
            margin-bottom: 6px;
        }
        .settings-menu-item:last-child {
            margin-bottom: 0;
        }
        .upload-menu-item {
            position: relative;
            overflow: hidden;
        }
        .upload-menu-item input {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }
        .config-actions-bar {
            display: none;
        }
        .subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 30px;
        }
        .string-definitions {
            background: white;
            border-left: 4px solid #3498db;
            padding: 14px 18px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .string-definitions h2 {
            font-size: 1.1em;
            margin: 0 0 10px;
            color: #34495e;
        }
        .btn-toggle-definitions {
            background-color: #3498db;
            color: white;
            padding: 8px 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95em;
            font-weight: bold;
            margin-bottom: 12px;
        }
        .btn-toggle-definitions:hover {
            background-color: #2980b9;
        }
        .string-definition {
            padding: 6px 0;
            border-top: 1px solid #eee;
        }
        .string-definition:first-of-type {
            border-top: none;
        }
        .configuration-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }
        .configuration-actions button {
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-apply-configuration {
            background-color: #27ae60;
            color: white;
        }
        .btn-reset-configuration {
            background-color: #ecf0f1;
            color: #34495e;
        }
        .configuration-string {
            border-top: 1px solid #eee;
            padding: 14px 0 4px;
        }
        .configuration-string h3 {
            margin: 0 0 10px;
            font-size: 1em;
            color: #34495e;
        }
        .configuration-group {
            display: grid;
            grid-template-columns: minmax(180px, 1fr) repeat(3, minmax(95px, 130px));
            gap: 8px;
            align-items: end;
            margin: 8px 0;
        }
        .configuration-group label {
            display: flex;
            flex-direction: column;
            gap: 3px;
            font-size: 0.8em;
            color: #5d6d7e;
        }
        .configuration-group input {
            width: 100%;
            box-sizing: border-box;
            padding: 6px;
            border: 1px solid #bdc3c7;
            border-radius: 4px;
        }
        .configuration-status {
            color: #27ae60;
            font-size: 0.9em;
            margin: 8px 0 0;
        }
        @media (max-width: 700px) {
            .header-row {
                justify-content: space-between;
                align-items: flex-start;
                padding-top: 0;
            }
            h1 {
                padding-right: 0;
                font-size: 1.4em;
                text-align: left;
                max-width: 58%;
            }
            .header-actions {
                position: static;
                display: flex;
                align-items: center;
                justify-content: flex-end;
                gap: 6px;
            }
            #language-switch,
            #settings-button {
                padding: 6px 9px;
                font-size: 0.8em;
            }
            #language-switch {
                min-width: 46px;
            }
            .settings-menu {
                right: 0;
                left: auto;
                min-width: 180px;
            }
            .settings-menu-item {
                padding: 9px 10px;
                font-size: 0.85em;
            }
            .configuration-group {
                grid-template-columns: 1fr 1fr 1fr;
            }
            .configuration-group label:first-child {
                grid-column: 1 / -1;
            }
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-top: 5px solid #bdc3c7;
            position: relative;
        }
        .card.today {

            background-color: #fffdf2;

        .date-title {

            font-weight: bold;

        }
        .day-tag {

        .results {

        }
        .result-line {

            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 0.95em;
        }
        .total-line {

            padding-top: 6px;
            margin-top: 6px;
        }
        .loading {
            text-align: center;
            font-size: 1.2em;
            color: #7f8c8d;

        }

            z-index: 1000;

            top: 0;

        .modal-content {

            border: 1px solid #888;
            border-radius: 12px;

            box-shadow: 0 4px 20px rgba(0,0,0,0.2);

        .modal-header {
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 20px;
            color: #2c3e50;
        }
        .modal-close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }
        .modal-close:hover {
            color: black;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #34495e;
        }
        .input-group input {
            width: 100%;
            padding: 8px;
            border: 1px solid #bdc3c7;
            border-radius: 6px;
            font-size: 1em;
            box-sizing: border-box;
        }
        .button-group {
            margin-top: 20px;
            text-align: right;
        }
        .button-group button {
            padding: 10px 20px;
            margin-left: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
        }
        .btn-save {
            background-color: #27ae60;
            color: white;
        }
        .btn-save:hover {

        }
        .btn-cancel {
            background-color: #95a5a6;
            color: white;
        }
        .btn-cancel:hover {
            background-color: #7f8c8d;
        }
        .btn-edit {

            color: white;
            padding: 5px 10px;
            font-size: 0.85em;

            background-color: #2980b9;
        }

            padding: 10px;

            border-left: 4px solid #27ae60;

        }
        .actual-values.has-data {

        }
        .actual-values.empty {
            display: none;
        }
        .deviation {
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 3px;
        }
        .deviation.positive {
            background-color: #d5f4e6;
            color: #27ae60;
        }
        .deviation.negative {
            background-color: #fadbd8;
            color: #e74c3c;
        }
        .archive {
            background: white;
            margin-top: 24px;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .archive-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }
        .archive h2 {
            margin: 0;
            color: #2c3e50;
        }
        .archive-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .archive-actions button {
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-archive-export { background: #3498db; color: white; }
        .btn-archive-clear { background: #ecf0f1; color: #34495e; }
        .archive-table-wrapper { overflow-x: auto; margin-top: 14px; }
        .archive table { width: 100%; border-collapse: collapse; min-width: 620px; }
        .archive th, .archive td { padding: 9px 8px; border-bottom: 1px solid #eee; text-align: left; }
        .archive th { color: #5d6d7e; font-size: 0.82em; }
        .archive td { font-size: 0.9em; }
        .archive-row { cursor: pointer; }
        .archive-row:hover { background: #f8f9fa; }
        .archive-detail { margin-top: 14px; padding: 12px; background: #f8f9fa; border-left: 3px solid #3498db; }
        .archive-empty { color: #7f8c8d; margin-bottom: 0; }
        .archive-browser {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 18px;
            padding-top: 14px;
            border-top: 1px solid #eee;
        }
        .archive-browser select, .archive-browser button {
            padding: 8px 10px;
            border: 1px solid #bdc3c7;
            border-radius: 6px;
            background: white;
            color: #34495e;
        }
        .archive-browser button { cursor: pointer; font-weight: bold; }
        .archive-browser .btn-recalculate { background: #27ae60; border-color: #27ae60; color: white; }
        .archive-cards { margin-top: 14px; }

        .tab-bar {
            display: flex;
            gap: 10px;
            margin-top: 18px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .tab-button {
            border: 1px solid #dfe6e9;
            background: #f8fafc;
            color: #2d3748;
            border-radius: 8px;
            padding: 10px 16px;
            font-weight: 600;
            cursor: pointer;
        }
        .tab-button.active {
            background: #2c7be5;
            border-color: #2c7be5;
            color: white;
        }
        .annual-forecast-panel {
            display: none;
            margin-top: 12px;
            background: linear-gradient(180deg, #f8fbff 0%, #eef6ff 100%);
            border: 1px solid #dfe9f5;
            border-radius: 10px;
            padding: 18px;
        }
        .annual-forecast-panel.visible {
            display: block;
        }
        .annual-summary {
            display: grid;
            gap: 18px;
        }
        .annual-metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
        }
        .annual-metric {
            background: white;
            border: 1px solid #e4edf7;
            border-radius: 8px;
            padding: 12px 14px;
        }
        .annual-metric span {
            display: block;
            font-size: 0.85rem;
            color: #5b6b7a;
            margin-bottom: 6px;
        }
        .annual-metric strong {
            font-size: 1.4rem;
            color: #1d3557;
        }
        .annual-note {
            margin: 0;
            color: #475569;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-row">
        <h1 id="app-title" data-default="☀️ Live PV-Ertragsprognose & Historie">☀️ Live PV-Ertragsprognose & Historie</h1>
        <div class="header-actions">
            <button id="language-switch" type="button" onclick="toggleLanguage()" aria-label="Switch language">🌐 EN</button>
            <div style="position: relative;">
                <button id="settings-button" type="button" onclick="toggleSettingsMenu()" aria-haspopup="true" aria-expanded="false">⚙️ Settings</button>
                <div id="settings-menu" class="settings-menu" role="menu" aria-label="Settings menu">
                    <button id="download-template-btn" class="settings-menu-item" type="button" onclick="downloadTemplate()">Download template</button>
                    <button id="export-plant-btn" class="settings-menu-item" type="button" onclick="exportPlantConfiguration()">Export plant</button>
                    <label id="upload-json-btn" class="settings-menu-item upload-menu-item" role="menuitem">
                        <span>Upload JSON</span>
                        <input id="config-upload" type="file" accept=".json,application/json" />
                    </label>
                </div>
            </div>
        </div>
    </div>
    <div class="subtitle" id="anlage-subtitle" data-default="Echtzeitdaten via Open-Meteo API">Echtzeitdaten via Open-Meteo API</div>
    <button id="toggle-string-definitions" class="btn-toggle-definitions" type="button" style="display: none;" onclick="toggleStringDefinitions()">String-Konfiguration anzeigen</button>
    <div id="string-definitions" class="string-definitions" style="display: none;"></div>

    <div id="loading-text" class="loading" data-default="Lade Live-Wetterdaten und berechne Erträge...">Lade Live-Wetterdaten und berechne Erträge...</div>

    <div class="tab-bar" role="tablist" aria-label="Dashboard views">
        <button id="tab-daily" class="tab-button active" type="button" data-tab="daily" aria-selected="true">Daily overview</button>
        <button id="tab-annual" class="tab-button" type="button" data-tab="annual" aria-selected="false">Annual forecast</button>
    </div>

    <div class="grid" id="dashboard-grid" style="display: none;"></div>
    <div id="annual-forecast-panel" class="annual-forecast-panel" aria-live="polite"></div>

    <section class="archive" aria-labelledby="archive-title">
        <div class="archive-header">
            <h2 id="archive-title" data-default="Historisches Archiv">Historisches Archiv</h2>
            <div class="archive-actions">
                <button class="btn-archive-export" type="button" onclick="exportArchive()">Archiv exportieren</button>
                <button class="btn-archive-clear" type="button" onclick="clearArchive()">Archiv löschen</button>
            </div>
        </div>
        <p id="archive-empty" class="archive-empty" data-default="Noch keine historischen API-Daten gespeichert.">Noch keine historischen API-Daten gespeichert.</p>
        <div class="archive-table-wrapper">
            <table id="archive-table" style="display: none;">
                <thead><tr><th>Datum</th><th>Wetter</th><th>Prognose</th><th>Realwert</th><th>Abweichung</th></tr></thead>
                <tbody id="archive-table-body"></tbody>
            </table>
        </div>
        <div id="archive-detail" class="archive-detail" style="display: none;"></div>
        <div id="archive-browser" class="archive-browser" style="display: none;">
            <strong id="archive-browser-label">Archivkarte:</strong>
            <button id="archive-prev-button" type="button" onclick="showPreviousArchiveDay()" aria-label="Vorheriger Archivtag">&larr;</button>
            <select id="archive-date-select" onchange="showSelectedArchiveDay()" aria-label="Archivdatum"></select>
            <button id="archive-next-button" type="button" onclick="showNextArchiveDay()" aria-label="Nächster Archivtag">&rarr;</button>
            <button class="btn-recalculate" type="button" onclick="recalculateSelectedArchiveDay()">Prognose neu berechnen</button>
        </div>
        <div id="archive-cards" class="grid archive-cards" style="display: none;"></div>
    </section>
</div>

<!-- Modal für Realwerte eingeben -->
<div id="actual-values-modal" class="modal">
    <div class="modal-content">
        <span class="modal-close" onclick="closeActualValuesModal()">&times;</span>
        <div id="actual-values-title" class="modal-header">Realwerte eingeben</div>
        <div class="input-group">
            <label id="actual-date-label">Datum:</label>
            <input type="date" id="actual-date-input" />
        </div>
        <div id="string-inputs"></div>
        <div class="button-group">
            <button class="btn-cancel" onclick="closeActualValuesModal()">Abbrechen</button>
            <button class="btn-save" onclick="saveActualValues()">Speichern</button>
        </div>
    </div>
</div>

<script src="i18n.js"></script>
<script src="calc.js"></script>
<script>
let anlagenKonfiguration;
let anlagenKonfigurationOriginal;
const KONFIGURATIONS_URLEN = [
    "./plant-config.json",
    "https://raw.githubusercontent.com/alizim/PV-Calculator/main/plant-config.json"
];

let weekdayNames = ["Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"];
let labelNames = { "-2": getText("labels.dayBeforeYesterday"), "-1": getText("labels.yesterday"), "0": getText("labels.today"), "1": getText("labels.tomorrow"), "2": getText("labels.dayAfterTomorrow") };

function refreshDayLabels() {
    weekdayNames = [
        getText("weekday.sunday"),
        getText("weekday.monday"),
        getText("weekday.tuesday"),
        getText("weekday.wednesday"),
        getText("weekday.thursday"),
        getText("weekday.friday"),
        getText("weekday.saturday")
    ];
    labelNames = {
        "-2": getText("labels.dayBeforeYesterday"),
        "-1": getText("labels.yesterday"),
        "0": getText("labels.today"),
        "1": getText("labels.tomorrow"),
        "2": getText("labels.dayAfterTomorrow")
    };
}

document.getElementById("config-upload").addEventListener("change", handleConfigUpload);

function applyLegacyAliases(target, englishKey, legacyKey) {
    if (!target || typeof target !== "object") return;
    if (englishKey === legacyKey) return;

    Object.defineProperty(target, legacyKey, {
        get() {
            return target[englishKey];
        },
        set(value) {
            target[englishKey] = value;
        },
        enumerable: false,
        configurable: true
    });
}

function normalizeCoordinates(rawCoordinates) {
    const source = rawCoordinates && typeof rawCoordinates === "object" ? rawCoordinates : {};
    const latitude = Number(source.latitude ?? source.lat ?? source.y ?? 0);
    const longitude = Number(source.longitude ?? source.lon ?? source.x ?? 0);

    const normalized = {
        latitude: Number.isFinite(latitude) ? Math.min(90, Math.max(-90, latitude)) : 0,
        longitude: Number.isFinite(longitude) ? Math.min(180, Math.max(-180, longitude)) : 0
    };

    applyLegacyAliases(normalized, "latitude", "latitude");
    applyLegacyAliases(normalized, "longitude", "longitude");
    return normalized;
}

function normalizeModuleGroup(group, fallbackLossFactor) {
    const normalized = {
        moduleCount: group.moduleCount ?? group.anzahl_module ?? 0,
        tiltDegrees: group.tiltDegrees ?? group.neigung_grad ?? 0,
        azimuthDegrees: group.azimuthDegrees ?? group.azimut_grad ?? 0,
        orientation: group.orientation ?? group.ausrichtung ?? "",
        lossFactor: group.lossFactor ?? group.verlustfaktor ?? fallbackLossFactor ?? 0.85
    };

    applyLegacyAliases(normalized, "moduleCount", "anzahl_module");
    applyLegacyAliases(normalized, "tiltDegrees", "neigung_grad");
    applyLegacyAliases(normalized, "azimuthDegrees", "azimut_grad");
    applyLegacyAliases(normalized, "orientation", "ausrichtung");
    applyLegacyAliases(normalized, "lossFactor", "verlustfaktor");
    return normalized;
}

function normalizeStringConfiguration(string, index, fallbackLossFactor) {
    const normalized = {
        stringId: string.stringId ?? string.string_id ?? index + 1,
        name: string.name ?? `String ${string.stringId ?? string.string_id ?? index + 1}`,
        totalModuleCount: string.totalModuleCount ?? string.gesamt_module_anzahl ?? 0,
        mainOrientation: string.mainOrientation ?? string.haupt_ausrichtung ?? "",
        lossFactor: string.lossFactor ?? string.verlustfaktor ?? fallbackLossFactor ?? 0.85,
        moduleGroupsByTilt: (string.moduleGroupsByTilt ?? string.modul_gruppen_nach_neigung ?? []).map(group => normalizeModuleGroup(group, string.lossFactor ?? string.verlustfaktor ?? fallbackLossFactor ?? 0.85))
    };

    applyLegacyAliases(normalized, "stringId", "string_id");
    applyLegacyAliases(normalized, "totalModuleCount", "gesamt_module_anzahl");
    applyLegacyAliases(normalized, "mainOrientation", "haupt_ausrichtung");
    applyLegacyAliases(normalized, "lossFactor", "verlustfaktor");
    applyLegacyAliases(normalized, "moduleGroupsByTilt", "modul_gruppen_nach_neigung");
    return normalized;
}

function normalizePlantConfiguration(config) {
    if (!config || typeof config !== "object") return config;

    const systemProfileSource = config.systemProfile ?? config.system_steckbrief ?? {};
    const moduleSource = systemProfileSource.module ?? {};
    const normalized = {
        site: config.site ?? config.standort ?? "",
        description: config.description ?? config.beschreibung ?? "",
        coordinates: normalizeCoordinates(config.coordinates ?? config.koordinaten ?? { latitude: 0, longitude: 0 }),
        defaultLossFactor: config.defaultLossFactor ?? config.verlustfaktor_standard ?? 0.85,
        systemProfile: {
            installedPowerKwp: systemProfileSource.installedPowerKwp ?? systemProfileSource.installierte_leistung_kwp ?? 0,
            module: {
                count: moduleSource.count ?? moduleSource.anzahl ?? 0,
                model: moduleSource.model ?? moduleSource.modell ?? "",
                powerPerModuleW: moduleSource.powerPerModuleW ?? moduleSource.leistung_pro_modul_w ?? 0,
                optimizer: moduleSource.optimizer ?? moduleSource.optimierer ?? ""
            }
        },
        stringConfiguration: (config.stringConfiguration ?? config.string_aufteilung ?? []).map((string, index) => normalizeStringConfiguration(string, index, config.defaultLossFactor ?? config.verlustfaktor_standard ?? 0.85))
    };

    applyLegacyAliases(normalized, "site", "standort");
    applyLegacyAliases(normalized, "description", "beschreibung");
    applyLegacyAliases(normalized, "coordinates", "koordinaten");
    applyLegacyAliases(normalized, "defaultLossFactor", "verlustfaktor_standard");
    applyLegacyAliases(normalized, "systemProfile", "system_steckbrief");
    applyLegacyAliases(normalized, "stringConfiguration", "string_aufteilung");

    applyLegacyAliases(normalized.coordinates, "latitude", "latitude");
    applyLegacyAliases(normalized.coordinates, "longitude", "longitude");
    applyLegacyAliases(normalized.systemProfile, "installedPowerKwp", "installierte_leistung_kwp");
    applyLegacyAliases(normalized.systemProfile.module, "count", "anzahl");
    applyLegacyAliases(normalized.systemProfile.module, "model", "modell");
    applyLegacyAliases(normalized.systemProfile.module, "powerPerModuleW", "leistung_pro_modul_w");
    applyLegacyAliases(normalized.systemProfile.module, "optimizer", "optimierer");

    return normalized;
}

function serializePlantConfiguration(config) {
    const normalized = normalizePlantConfiguration(config);
    return JSON.stringify({
        site: normalized.site,
        description: normalized.description,
        coordinates: normalized.coordinates,
        defaultLossFactor: normalized.defaultLossFactor,
        systemProfile: normalized.systemProfile,
        stringConfiguration: normalized.stringConfiguration
    }, null, 2);
}

function toggleSettingsMenu() {
    const menu = document.getElementById("settings-menu");
    const button = document.getElementById("settings-button");
    if (!menu || !button) return;

    const isOpen = menu.classList.toggle("open");
    button.setAttribute("aria-expanded", String(isOpen));
}

document.addEventListener("click", function(event) {
    const menu = document.getElementById("settings-menu");
    const button = document.getElementById("settings-button");
    if (!menu || !button) return;

    const clickInsideMenu = menu.contains(event.target);
    const clickOnButton = button.contains(event.target);
    if (!clickInsideMenu && !clickOnButton) {
        menu.classList.remove("open");
        button.setAttribute("aria-expanded", "false");
    }
});

// Hilfsfunktion zur Formatierung von Date-Objekten zu YYYY-MM-DD
function formatDate(date) {
    return date.toISOString().split('T')[0];
}

function getDateRange() {
    const heute = new Date();
    const vonDatum = new Date(heute);
    vonDatum.setDate(heute.getDate() - 2);
    const bisDatum = new Date(heute);
    bisDatum.setDate(heute.getDate() + 2);
    return { vonDatum, bisDatum };
}

function downloadTemplate() {
    const link = document.createElement("a");
    link.href = "./dummy-plant-config.json";
    link.download = "dummy-plant-config.json";
    document.body.appendChild(link);
    link.click();
    link.remove();
}

function exportPlantConfiguration() {
    if (!anlagenKonfiguration) {
        alert("Keine Anlage geladen, die exportiert werden kann.");
        return;
    }

    const blob = new Blob([JSON.stringify(anlagenKonfiguration, null, 2)], { type: "application/json" });
    const link = document.createElement("a");
    const fileName = (anlagenKonfiguration.standort || "plant-config").toLowerCase()
        .replace(/\s+/g, "-")
        .replace(/[^a-z0-9-_]/g, "") || "plant-config";
    link.href = URL.createObjectURL(blob);
    link.download = `${fileName}.json`;
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(link.href);
}

function handleConfigUpload(event) {
    const file = event.target.files && event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = () => {
        try {
            const parsed = JSON.parse(reader.result);
            const hasEnglishConfig = parsed && parsed.coordinates && parsed.systemProfile && Array.isArray(parsed.stringConfiguration);
            const hasLegacyConfig = parsed && parsed.koordinaten && parsed.system_steckbrief && Array.isArray(parsed.string_aufteilung);
            if (!parsed || (!hasEnglishConfig && !hasLegacyConfig)) {
                throw new Error("Ungültige JSON-Struktur für eine PV-Anlage.");
            }

            anlagenKonfiguration = normalizePlantConfiguration(parsed);
            anlagenKonfigurationOriginal = structuredClone(anlagenKonfiguration);
            localStorage.setItem("pv_uploaded_configuration", serializePlantConfiguration(anlagenKonfiguration));
            event.target.value = "";
            fetchAndCalculate();
        } catch (error) {
            alert(`Upload fehlgeschlagen: ${error.message}`);
        }
    };
    reader.readAsText(file);
}

async function fetchTiltedIrradiance(config, vonDatum, bisDatum) {
    const gruppen = (config.stringConfiguration ?? config.string_aufteilung ?? []).flatMap(string => string.moduleGroupsByTilt ?? string.modul_gruppen_nach_neigung ?? []);
    const profile = new Map();

    const coordinates = normalizeCoordinates(config.coordinates ?? config.koordinaten ?? {});
    const latitude = Number(coordinates.latitude);
    const longitude = Number(coordinates.longitude);

    if (!Number.isFinite(latitude) || !Number.isFinite(longitude)) {
        throw new Error("Die Koordinaten der Anlage sind ungültig.");
    }

    const validGroups = gruppen.filter(gruppe => {
        const tilt = Number(gruppe.tiltDegrees ?? gruppe.neigung_grad ?? NaN);
        const azimut = Number(gruppe.azimuthDegrees ?? gruppe.azimut_grad ?? NaN);
        return Number.isFinite(tilt) && Number.isFinite(azimut) && tilt >= 0 && tilt <= 90 && azimut >= -180 && azimut <= 180;
    });

    await Promise.all(validGroups.map(async gruppe => {
        const azimut = Math.min(180, Math.max(-180, Number(gruppe.azimuthDegrees ?? gruppe.azimut_grad ?? 0)));
        const tilt = Math.min(90, Math.max(0, Number(gruppe.tiltDegrees ?? gruppe.neigung_grad ?? 0)));
        const profileKey = `${tilt}:${azimut}`;
        if (profile.has(profileKey)) return;

        const url = `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&hourly=global_tilted_irradiance&tilt=${tilt}&azimuth=${azimut}&timezone=Europe%2FBerlin&start_date=${formatDate(vonDatum)}&end_date=${formatDate(bisDatum)}`;
        const response = await fetch(url);
        if (!response.ok) {
            const groupInfo = {
                tilt,
                azimuth: azimut,
                latitude,
                longitude,
                stringId: gruppe.stringId ?? gruppe.string_id ?? "unknown",
                groupName: gruppe.description ?? "module-group"
            };
            console.warn("Open-Meteo 400 for group:", groupInfo);
            throw new Error(`Einstrahlungsprofil konnte nicht geladen werden (HTTP ${response.status}) für tilt=${tilt}, azimuth=${azimut}, lat=${latitude}, lon=${longitude}`);
        }
        const data = await response.json();
        profile.set(profileKey, data.hourly);
    }));

    return profile;
}

async function fetchAndCalculate() {
    try {
        if (window.location.protocol === "file:") {
            throw new Error(getText("fileServerWarning"));
        }

        if (!anlagenKonfiguration) {
            let letzterKonfigurationsfehler;
            for (const konfigurationsUrl of KONFIGURATIONS_URLEN) {
                try {
                    const configUrl = new URL(konfigurationsUrl, document.baseURI);
                    const configResponse = await fetch(configUrl);
                    if (!configResponse.ok) throw new Error(`HTTP ${configResponse.status}`);
                    anlagenKonfiguration = normalizePlantConfiguration(await configResponse.json());
                    anlagenKonfigurationOriginal = structuredClone(anlagenKonfiguration);
                    const gespeicherteStrings = localStorage.getItem("pv_string_configuration");
                    if (gespeicherteStrings) {
                        anlagenKonfiguration.stringConfiguration = JSON.parse(gespeicherteStrings).map((string, index) => normalizeStringConfiguration(string, index, anlagenKonfiguration.defaultLossFactor));
                        localStorage.setItem("pv_string_configuration", JSON.stringify(anlagenKonfiguration.stringConfiguration.map(string => ({
                            stringId: string.stringId,
                            name: string.name,
                            totalModuleCount: string.totalModuleCount,
                            mainOrientation: string.mainOrientation,
                            lossFactor: string.lossFactor,
                            moduleGroupsByTilt: string.moduleGroupsByTilt.map(group => ({
                                moduleCount: group.moduleCount,
                                tiltDegrees: group.tiltDegrees,
                                azimuthDegrees: group.azimuthDegrees,
                                orientation: group.orientation,
                                lossFactor: group.lossFactor
                            }))
                        }))));
                    }
                    break;
                } catch (error) {
                    letzterKonfigurationsfehler = error;
                }
            }
            if (!anlagenKonfiguration) {
                const uploadedConfig = localStorage.getItem("pv_uploaded_configuration");
                if (uploadedConfig) {
                    try {
                        anlagenKonfiguration = normalizePlantConfiguration(JSON.parse(uploadedConfig));
                        anlagenKonfigurationOriginal = structuredClone(anlagenKonfiguration);
                        localStorage.setItem("pv_uploaded_configuration", serializePlantConfiguration(anlagenKonfiguration));
                    } catch (error) {
                        localStorage.removeItem("pv_uploaded_configuration");
                    }
                }
            }
            if (!anlagenKonfiguration) {
                throw new Error(`Anlagenkonfiguration konnte nicht geladen werden: ${letzterKonfigurationsfehler.message}`);
            }
        }

        const { vonDatum, bisDatum } = getDateRange();

        // Open-Meteo API URL für Historie + Vorhersage kombiniert
        const coordinates = normalizeCoordinates(anlagenKonfiguration.coordinates ?? anlagenKonfiguration.koordinaten ?? {});
        const { latitude, longitude } = coordinates;
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&daily=weather_code,temperature_2m_max,shortwave_radiation_sum&timezone=Europe%2FBerlin&start_date=${formatDate(vonDatum)}&end_date=${formatDate(bisDatum)}`;

        const [response, irradianceProfiles] = await Promise.all([
            fetch(url),
            fetchTiltedIrradiance(anlagenKonfiguration, vonDatum, bisDatum)
        ]);
        if (!response.ok) throw new Error(`Wetterdaten konnten nicht geladen werden (HTTP ${response.status})`);
        const data = await response.json();

        if (!data.daily) throw new Error(getText("apiDataError"));

        const anlagenBeschreibung = anlagenKonfiguration.description ?? anlagenKonfiguration.beschreibung ?? "Photovoltaikanlage";
        const standort = anlagenKonfiguration.site ?? anlagenKonfiguration.standort ?? "Standort";
        const installierteLeistung = anlagenKonfiguration.systemProfile?.installedPowerKwp ?? anlagenKonfiguration.system_steckbrief?.installierte_leistung_kwp ?? 0;
        document.getElementById("anlage-subtitle").innerText =
            `${anlagenBeschreibung} | Standort: ${standort} | ${installierteLeistung.toFixed(2)} kWp`;
        renderStringDefinitions(anlagenKonfiguration);
        renderDashboard(data.daily, anlagenKonfiguration, irradianceProfiles);
        window.currentAnnualForecastData = data.daily;
        window.currentAnnualForecastProfiles = irradianceProfiles;
        renderAnnualForecast(data.daily, anlagenKonfiguration, irradianceProfiles);
        renderArchive();
        applyUiTranslations();
    } catch (error) {
        document.getElementById("loading-text").innerText = getText("errorLoading") + error.message;
    }
}

function getWeatherSymbol(code) {
    // WMO Weather Codes zu Emojis
    if (code <= 1) return getText("weather.sun");
    if (code <= 3) return getText("weather.variable");
    if (code >= 51) return getText("weather.rain");
    return getText("weather.cloud");
}

function renderStringDefinitions(config) {
    const definitions = document.getElementById("string-definitions");
    const strings = config.stringConfiguration ?? config.string_aufteilung ?? [];
    const entries = strings.map(string => {
        const groups = (string.moduleGroupsByTilt ?? string.modul_gruppen_nach_neigung ?? []).map(gruppe => {
            const orientation = gruppe.orientation ?? gruppe.ausrichtung ?? `${getText("labels.azimuth")} ${gruppe.azimuthDegrees ?? gruppe.azimut_grad ?? 0}°`;
            return `${gruppe.moduleCount ?? gruppe.anzahl_module}x ${gruppe.tiltDegrees ?? gruppe.neigung_grad}° ${getText("labels.tilt")}, ${orientation}`;
        }).join("; ");
        const stringId = string.stringId ?? string.string_id;
        const name = string.name || `${getText("labels.string")} ${stringId}`;
        const mainOrientation = string.mainOrientation ?? string.haupt_ausrichtung ?? getText("labels.noOrientation");
        return `<div class="string-definition"><strong>${getText("labels.string")} ${stringId}: ${name}</strong> - ${string.totalModuleCount ?? string.gesamt_module_anzahl} ${getText("labels.perModule")}, ${mainOrientation}<br><small>${groups}</small></div>`;
    }).join("");

    const editor = strings.map(string => {
        const stringId = string.stringId ?? string.string_id;
        const groups = (string.moduleGroupsByTilt ?? string.modul_gruppen_nach_neigung ?? []).map((gruppe, groupIndex) => `
            <div class="configuration-group">
                <label>${gruppe.description || `${getText("labels.moduleGroup")} ${groupIndex + 1}`}
                    <small>${gruppe.moduleCount ?? gruppe.anzahl_module} ${getText("labels.perModule")}</small>
                </label>
                <label>${getText("labels.azimuth")} (°)<input type="number" step="0.1" data-string-id="${stringId}" data-group-index="${groupIndex}" data-field="azimuthDegrees" value="${gruppe.azimuthDegrees ?? gruppe.azimut_grad}"></label>
                <label>${getText("labels.tilt")} (°)<input type="number" min="0" max="90" step="0.1" data-string-id="${stringId}" data-group-index="${groupIndex}" data-field="tiltDegrees" value="${gruppe.tiltDegrees ?? gruppe.neigung_grad}"></label>
                <label>${getText("labels.loss")}<input type="number" min="0" max="1" step="0.01" data-string-id="${stringId}" data-group-index="${groupIndex}" data-field="lossFactor" value="${gruppe.lossFactor ?? gruppe.verlustfaktor ?? string.lossFactor ?? string.verlustfaktor ?? config.defaultLossFactor ?? config.verlustfaktor_standard}"></label>
            </div>`).join("");
        return `<section class="configuration-string"><h3>${getText("labels.string")} ${stringId}: ${string.name || `${getText("labels.string")} ${stringId}`}</h3>${groups}</section>`;
    }).join("");

    definitions.innerHTML = `<h2>${getText("stringConfigTitle")}</h2>
        <div class="configuration-actions">
            <button class="btn-apply-configuration" type="button" onclick="applyStringConfiguration()">${getText("applyChanges")}</button>
            <button class="btn-reset-configuration" type="button" onclick="resetStringConfiguration()">${getText("resetConfig")}</button>
        </div>
        ${editor}
        <p id="configuration-status" class="configuration-status" aria-live="polite"></p>
        <hr>${entries}`;
    document.getElementById("toggle-string-definitions").style.display = "inline-block";
    document.getElementById("toggle-string-definitions").dataset.visible = "false";
    document.getElementById("toggle-string-definitions").textContent = getText("toggleStrings");
}

function applyStringConfiguration() {
    const inputs = document.querySelectorAll("#string-definitions input[data-field]");
    const changedConfiguration = structuredClone(anlagenKonfiguration);

    for (const input of inputs) {
        const value = Number(input.value);
        if (!Number.isFinite(value)) {
            input.focus();
            alert(getText("invalidNumber"));
            return;
        }
        if (input.dataset.field === "lossFactor" && (value < 0 || value > 1)) {
            input.focus();
            alert(getText("invalidLossFactor"));
            return;
        }
        const string = (changedConfiguration.stringConfiguration ?? changedConfiguration.string_aufteilung ?? []).find(item => String(item.stringId ?? item.string_id) === input.dataset.stringId);
        const groups = string.moduleGroupsByTilt ?? string.modul_gruppen_nach_neigung ?? [];
        groups[Number(input.dataset.groupIndex)][input.dataset.field] = value;
    }

    anlagenKonfiguration = changedConfiguration;
    localStorage.setItem("pv_string_configuration", JSON.stringify(anlagenKonfiguration.stringConfiguration.map(string => ({
        stringId: string.stringId,
        name: string.name,
        totalModuleCount: string.totalModuleCount,
        mainOrientation: string.mainOrientation,
        lossFactor: string.lossFactor,
        moduleGroupsByTilt: string.moduleGroupsByTilt.map(group => ({
            moduleCount: group.moduleCount,
            tiltDegrees: group.tiltDegrees,
            azimuthDegrees: group.azimuthDegrees,
            orientation: group.orientation,
            lossFactor: group.lossFactor
        }))
    }))));
    document.getElementById("configuration-status").innerText = getText("changesLoading");
    fetchAndCalculate();
}

function resetStringConfiguration() {
    anlagenKonfiguration = structuredClone(anlagenKonfigurationOriginal);
    localStorage.removeItem("pv_string_configuration");
    renderStringDefinitions(anlagenKonfiguration);
    document.getElementById("configuration-status").innerText = getText("jsonRestored");
    fetchAndCalculate();
}

function getArchiveDayCount() {
    const archive = loadArchive();
    let archiveDayCount = 0;

    Object.values(archive || {}).forEach(record => {
        if (!record || !record.date || !record.forecast || !Number.isFinite(Number(record.forecast.total))) {
            return;
        }
        archiveDayCount += 1;
    });

    return archiveDayCount;
}

function getHistoricalAnnualReference() {
    const archive = loadArchive();
    const yearlyTotals = {};
    const currentYear = new Date().getFullYear();

    if (getArchiveDayCount() < 200) {
        return { annualEstimate: 0, years: [], currentYearTotal: 0, source: "archive-insufficient" };
    }

    Object.values(archive || {}).forEach(record => {
        if (!record || !record.date || !record.forecast || !Number.isFinite(Number(record.forecast.total))) {
            return;
        }
        const year = Number(record.date.slice(0, 4));
        if (!Number.isFinite(year) || year < currentYear - 5) {
            return;
        }
        yearlyTotals[year] = (yearlyTotals[year] || 0) + Number(record.forecast.total);
    });

    const years = Object.keys(yearlyTotals).sort((first, second) => Number(first) - Number(second));
    if (!years.length) {
        return { annualEstimate: 0, years: [], currentYearTotal: 0, source: "archive-insufficient" };
    }

    const selectedYears = years.slice(Math.max(0, years.length - 5));
    let totalWeight = 0;
    let weightedTotal = 0;

    selectedYears.forEach((year, index) => {
        const weight = selectedYears.length - index;
        totalWeight += weight;
        weightedTotal += (yearlyTotals[year] || 0) * weight;
    });

    return {
        annualEstimate: totalWeight > 0 ? weightedTotal / totalWeight : 0,
        years: selectedYears,
        currentYearTotal: yearlyTotals[currentYear] || 0,
        source: "archive"
    };
}

async function fetchHistoricalAnnualReference(config) {
    const archiveDayCount = getArchiveDayCount();
    if (archiveDayCount >= 200) {
        const archiveReference = getHistoricalAnnualReference();
        if (archiveReference.years.length) {
            return archiveReference;
        }
    }

    const coordinates = normalizeCoordinates(config.coordinates ?? config.koordinaten ?? {});
    const latitude = Number(coordinates.latitude);
    const longitude = Number(coordinates.longitude);
    const currentYear = new Date().getFullYear();

    if (!Number.isFinite(latitude) || !Number.isFinite(longitude)) {
        return getHistoricalAnnualReference();
    }

    const years = [];
    for (let year = currentYear - 4; year <= currentYear; year++) {
        years.push(year);
    }

    const results = await Promise.all(years.map(async year => {
        const url = `https://archive-api.open-meteo.com/v1/archive?latitude=${latitude}&longitude=${longitude}&daily=shortwave_radiation_sum&timezone=Europe%2FBerlin&start_date=${year}-01-01&end_date=${year}-12-31`;
        try {
            const response = await fetch(url);
            if (!response.ok) return { year, total: 0 };
            const data = await response.json();
            const dailyValues = Array.isArray(data.daily?.shortwave_radiation_sum) ? data.daily.shortwave_radiation_sum : [];
            const total = dailyValues.reduce((sum, value) => sum + Number(value || 0), 0);
            return { year, total: Number.isFinite(total) ? total : 0 };
        } catch (error) {
            return { year, total: 0 };
        }
    }));

    const yearlyTotals = {};
    results.forEach(({ year, total }) => {
        if (total > 0) yearlyTotals[year] = total;
    });

    if (!Object.keys(yearlyTotals).length) {
        return getHistoricalAnnualReference();
    }

    const sortedYears = Object.keys(yearlyTotals).sort((first, second) => Number(first) - Number(second));
    const selectedYears = sortedYears.slice(Math.max(0, sortedYears.length - 5));
    let totalWeight = 0;
    let weightedTotal = 0;

    selectedYears.forEach((year, index) => {
        const weight = selectedYears.length - index;
        totalWeight += weight;
        weightedTotal += (yearlyTotals[year] || 0) * weight;
    });

    const annualEstimate = totalWeight > 0 ? weightedTotal / totalWeight : 0;
    return {
        annualEstimate,
        years: selectedYears,
        currentYearTotal: yearlyTotals[currentYear] || 0,
        source: "open-meteo"
    };
}

async function fetchHistoricalSeasonalFraction(config, startDate, endDate) {
    const coordinates = normalizeCoordinates(config.coordinates ?? config.koordinaten ?? {});
    const latitude = Number(coordinates.latitude);
    const longitude = Number(coordinates.longitude);
    const currentYear = endDate.getFullYear();
    const startMonth = startDate.getMonth();
    const startDay = startDate.getDate();
    const endMonth = endDate.getMonth();
    const endDay = endDate.getDate();

    if (!Number.isFinite(latitude) || !Number.isFinite(longitude) || startDate > endDate) {
        return null;
    }

    const results = await Promise.all(Array.from({ length: 5 }, async (_, index) => {
        const year = currentYear - index - 1;
        const url = `https://archive-api.open-meteo.com/v1/archive?latitude=${latitude}&longitude=${longitude}&daily=shortwave_radiation_sum&timezone=Europe%2FBerlin&start_date=${year}-01-01&end_date=${year}-12-31`;
        try {
            const response = await fetch(url);
            if (!response.ok) return null;
            const data = await response.json();
            const values = Array.isArray(data.daily?.shortwave_radiation_sum) ? data.daily.shortwave_radiation_sum : [];
            const startIndex = Math.floor((Date.UTC(year, startMonth, startDay) - Date.UTC(year, 0, 1)) / 86400000);
            const endIndex = Math.floor((Date.UTC(year, endMonth, endDay) - Date.UTC(year, 0, 1)) / 86400000);
            const activeYearStartIndex = Math.max(0, Math.min(values.length - 1, startIndex));
            const activeYearEndIndex = Math.max(activeYearStartIndex, Math.min(values.length - 1, endIndex));
            const activeYearTotal = values.slice(activeYearStartIndex).reduce((sum, value) => sum + Number(value || 0), 0);
            const activePeriodTotal = values.slice(activeYearStartIndex, activeYearEndIndex + 1).reduce((sum, value) => sum + Number(value || 0), 0);
            return { activeYearTotal, activePeriodTotal };
        } catch (error) {
            return null;
        }
    }));

    const validResults = results.filter(result => result && result.activeYearTotal > 0);
    if (!validResults.length) return null;

    const activeYearTotal = validResults.reduce((sum, result) => sum + result.activeYearTotal, 0);
    const activePeriodTotal = validResults.reduce((sum, result) => sum + result.activePeriodTotal, 0);
    return activeYearTotal > 0 ? activePeriodTotal / activeYearTotal : null;
}

async function renderAnnualForecast(dailyData, config, irradianceProfiles) {
    const panel = document.getElementById("annual-forecast-panel");
    if (!panel) return;

    const visibleDays = Array.isArray(dailyData?.time) ? dailyData.time.length : 0;
    let totalForecast = 0;
    let totalCurrentIrradiation = 0;

    for (let i = 0; i < visibleDays; i++) {
        const date = dailyData.time[i];
        const stringYields = calculateStringYields(date, config, irradianceProfiles);
        const currentDayYield = stringYields.reduce((sum, string) => sum + string.ertrag, 0);
        totalForecast += currentDayYield;
        totalCurrentIrradiation += Number(dailyData.shortwave_radiation_sum?.[i] ?? 0);
    }

    const avgPerDay = visibleDays > 0 ? totalForecast / visibleDays : 0;
    const currentProjection = avgPerDay * 365;
    const currentIrradiationKWhPerM2 = totalCurrentIrradiation > 0 ? totalCurrentIrradiation / 1000 : 0;
    const currentYieldPerIrradiation = currentIrradiationKWhPerM2 > 0 ? totalForecast / currentIrradiationKWhPerM2 : 0;
    const historicalReference = await fetchHistoricalAnnualReference(config);
    const historicalIrradiation = Number(historicalReference.annualEstimate || 0) / 1000;
    const historicalAverage = currentYieldPerIrradiation > 0 && historicalIrradiation > 0
        ? historicalIrradiation * currentYieldPerIrradiation
        : (historicalReference.annualEstimate || 0);
    const annualEstimateBase = historicalAverage > 0 ? historicalAverage : currentProjection;

    const today = new Date();
    const currentYear = today.getFullYear();
    const archive = loadArchive();
    const firstProductionCandidateDates = [];

    Object.values(archive || {}).forEach(record => {
        if (!record || !record.date || Number(record.date.slice(0, 4)) !== currentYear) return;
        const totalActual = record.actual ? Object.values(record.actual).reduce((sum, value) => sum + Number(value || 0), 0) : 0;
        if (Number.isFinite(totalActual) && totalActual > 0) {
            firstProductionCandidateDates.push(new Date(`${record.date}T12:00:00`));
        }
    });

    if (Array.isArray(dailyData?.time)) {
        dailyData.time.forEach((dateValue, index) => {
            const date = new Date(dateValue);
            const yieldValue = Number(calculateStringYields(dateValue, config, irradianceProfiles).reduce((sum, string) => sum + string.ertrag, 0) || 0);
            if (date.getFullYear() === currentYear && yieldValue > 0) {
                firstProductionCandidateDates.push(date);
            }
        });
    }

    const firstProductionDate = firstProductionCandidateDates.length
        ? new Date(Math.min(...firstProductionCandidateDates.map(date => date.getTime())))
        : new Date(currentYear, 0, 1);

    const yearStart = firstProductionDate;
    const dayOfYear = Math.max(1, Math.min(365, Math.floor((today - yearStart) / 86400000) + 1));
    const totalDaysOfYear = Math.max(1, Math.floor((new Date(currentYear, 11, 31, 12) - new Date(currentYear, 0, 1, 12)) / 86400000) + 1);
    const dateProgressPercent = Math.min(100, (dayOfYear / totalDaysOfYear) * 100);

    let realizedSoFar = 0;
    Object.values(archive || {}).forEach(record => {
        if (!record || !record.date || Number(record.date.slice(0, 4)) !== currentYear || record.date > formatDate(today) || !record.actual) return;
        const actualTotal = Object.values(record.actual).reduce((sum, value) => sum + Number(value || 0), 0);
        if (Number.isFinite(actualTotal)) {
            realizedSoFar += actualTotal;
        }
    });

    const totalDaysOfYearForEstimate = Math.max(1, Math.floor((new Date(currentYear, 11, 31, 12) - new Date(currentYear, 0, 1, 12)) / 86400000) + 1);
    const daysBeforeFirstProduction = Math.max(0, Math.floor((firstProductionDate - new Date(currentYear, 0, 1, 12)) / 86400000));
    const remainingYearFraction = Math.max(0, Math.min(1, (totalDaysOfYearForEstimate - daysBeforeFirstProduction) / totalDaysOfYearForEstimate));
    const annualEstimate = annualEstimateBase * remainingYearFraction;

    const historicalSeasonalFraction = await fetchHistoricalSeasonalFraction(config, firstProductionDate, today);
    const expectedProgressFraction = historicalSeasonalFraction === null
        ? dateProgressPercent / 100
        : Math.max(0, Math.min(1, historicalSeasonalFraction));
    const expectedSoFar = annualEstimate * expectedProgressFraction;
    const progressRatio = expectedSoFar > 0 ? realizedSoFar / expectedSoFar : 0;
    const annualProgressRatio = annualEstimate > 0 ? realizedSoFar / annualEstimate : 0;
    const progressPercent = Math.min(100, Math.max(0, annualProgressRatio * 100));
    const progressBarWidth = progressPercent;
    const progressBarColor = progressRatio >= 1 ? "#27ae60" : progressRatio >= 0.8 ? "#f39c12" : "#e74c3c";
    const progressText = progressRatio >= 1 ? getText("annualProgressAhead") : progressRatio >= 0.8 ? getText("annualProgressOnTrack") : getText("annualProgressBehind");

    panel.innerHTML = `
        <div class="annual-summary">
            <h3>${getText("annualForecastTitle")}</h3>
            <div class="annual-metrics">
                <div class="annual-metric">
                    <span>${getText("annualEstimate")}</span>
                    <strong>${annualEstimate.toFixed(0)} kWh</strong>
                </div>
                <div class="annual-metric">
                    <span>${getText("historicalAverage")}</span>
                    <strong>${historicalAverage.toFixed(0)} kWh</strong>
                </div>
                <div class="annual-metric">
                    <span>${getText("dailyAverage")}</span>
                    <strong>${avgPerDay.toFixed(2)} kWh/Tag</strong>
                </div>
                <div class="annual-metric">
                    <span>${getText("forecastDays")}</span>
                    <strong>${visibleDays} ${getText("labels.archive")}</strong>
                </div>
            </div>

            <div style="margin-top: 18px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 0.88em; color: #475569;">
                    <span>${getText("annualProgress")}</span>
                    <strong>${Math.round(progressPercent)}%</strong>
                </div>
                <div style="width: 100%; height: 12px; background: rgba(148, 163, 184, 0.25); border-radius: 999px; overflow: hidden;">
                    <div style="width: ${progressBarWidth}%; height: 100%; background: ${progressBarColor}; border-radius: 999px; transition: width 0.25s ease;"></div>
                </div>
                <div style="margin-top: 8px; font-size: 0.86em; color: #475569; line-height: 1.7;">
                    <div><strong>${getText("annualStart")}</strong>: ${firstProductionDate.toLocaleDateString('de-DE')}</div>
                    <div><strong>${getText("annualProgressReached")}</strong>: ${realizedSoFar.toFixed(0)} kWh</div>
                    <div><strong>${getText("annualProgressExpected")}</strong>: ${expectedSoFar.toFixed(0)} kWh</div>
                    <div style="color: ${progressBarColor}; font-weight: 700;">${progressText}</div>
                </div>
            </div>

            <p class="annual-note">${getText("annualEstimateNote")}</p>
        </div>
    `;
}

function renderDashboard(dailyData, config, irradianceProfiles, targetId = "dashboard-grid", persistArchive = true) {
    const grid = document.getElementById(targetId);
    grid.innerHTML = "";

    for (let i = 0; i < dailyData.time.length; i++) {
        const dayOffset = targetId === "dashboard-grid" ? i - 2 : null;
        
        const dateRaw = new Date(dailyData.time[i]);
        const dateStr = dateRaw.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' });
        const dayName = weekdayNames[dateRaw.getDay()];
        
        // Wetter- und Strahlungsdaten aus der API auflösen
        const tempMax = dailyData.temperature_2m_max[i];
        const radSum = dailyData.shortwave_radiation_sum[i] / 3.6; // Horizontale Globalstrahlung zur Information
        const weatherType = getWeatherSymbol(dailyData.weather_code[i]);
        const solarNoonElevation = getSolarNoonElevation(dateRaw, config.coordinates?.latitude ?? config.koordinaten?.latitude);

        const stringErtraege = calculateStringYields(dailyData.time[i], config, irradianceProfiles);
        const gesamtErtrag = stringErtraege.reduce((summe, string) => summe + string.ertrag, 0);
        if (persistArchive) {
            saveArchiveRecord(dailyData.time[i], dailyData, i, stringErtraege, gesamtErtrag, irradianceProfiles);
        }
        const stringZeilen = stringErtraege.map(string =>
            `<div class="result-line"><span>${getText("labels.string")} ${string.id}:</span> <span>${string.ertrag.toFixed(2)} kWh</span></div>`
        ).join("");

        const isTodayClass = dayOffset === 0 ? 'today' : '';

        const card = document.createElement("div");
        card.className = `card ${isTodayClass}`;
        card.innerHTML = `
            <div class="date-title">${dayName}, ${dateStr}</div>
            <div class="day-tag">${dayOffset === null ? getText("labels.archive") : labelNames[dayOffset]}</div>
            
            <div class="weather-info">
                <strong>${weatherType}</strong><br>
                ${getText("labels.weatherInfo")} ${tempMax.toFixed(1)} °C<br>
                ${getText("labels.radiation")} ${radSum.toFixed(2)} kWh/m²<br>
                <span class="sun-position">${getText("labels.solarNoon")} ${solarNoonElevation.toFixed(1)}°</span>
            </div>

            <div class="results">
                ${stringZeilen}
                <div class="result-line total-line"><span>${getText("labels.forecastTotal")}</span> <span>${gesamtErtrag.toFixed(2)} kWh</span></div>
            </div>

            <div id="${targetId}-actual-section-${i}" class="actual-values empty"></div>
            
            <div style="margin-top: 15px; text-align: center;">
                <button class="btn-edit" onclick="openActualValuesModal('${dailyData.time[i]}', ${i})">${getText("labels.edit")}</button>
            </div>
        `;
        grid.appendChild(card);
        
        // Nach dem Einfügen: Realwerte laden und anzeigen
        displayActualValuesForDay(dailyData.time[i], stringErtraege, `${targetId}-actual-section-${i}`);
    }

    // Loader ausblenden, Grid anzeigen
    if (targetId === "dashboard-grid") {
        document.getElementById("loading-text").style.display = "none";
    }
    grid.style.display = "grid";
}

const ARCHIVE_KEY = "pv_historical_archive_v2";
const LEGACY_ARCHIVE_KEY = "pv_historical_archive";

function loadArchive() {
    try {
        const activeKey = localStorage.getItem(ARCHIVE_KEY) !== null ? ARCHIVE_KEY : LEGACY_ARCHIVE_KEY;
        const archiveValue = localStorage.getItem(activeKey);
        if (archiveValue && !localStorage.getItem(ARCHIVE_KEY)) {
            localStorage.setItem(ARCHIVE_KEY, archiveValue);
        }
        return JSON.parse(archiveValue || "{}");
    } catch (error) {
        return {};
    }
}

function saveArchiveRecord(dateStr, dailyData, index, stringYields, totalForecast, irradianceProfiles) {
    const archive = loadArchive();
    const date = dateStr.slice(0, 10);
    const irradiance = {};
    for (const [profileKey, hourly] of irradianceProfiles) {
        irradiance[profileKey] = hourly.time.reduce((values, timestamp, hourlyIndex) => {
            if (timestamp.startsWith(date)) {
                values.push({ time: timestamp, value: hourly.global_tilted_irradiance[hourlyIndex] || 0 });
            }
            return values;
        }, []);
    }
    archive[date] = {
        date,
        savedAt: new Date().toISOString(),
        weatherCode: dailyData.weather_code[index],
        temperatureMax: dailyData.temperature_2m_max[index],
        horizontalRadiation: dailyData.shortwave_radiation_sum[index],
        forecast: {
            total: totalForecast,
            strings: Object.fromEntries(stringYields.map(string => [`string_${string.id}`, string.ertrag]))
        },
        tiltedIrradiance: irradiance,
        actual: loadActualValues(date) || archive[date]?.actual || null
    };
    localStorage.setItem(ARCHIVE_KEY, JSON.stringify(archive));
}

document.addEventListener("click", function(event) {
    const tabButton = event.target.closest(".tab-button");
    if (!tabButton) return;
    setActiveDashboardTab(tabButton.dataset.tab);
});

function renderArchive() {
    const archive = loadArchive();
    const records = Object.values(archive).sort((first, second) => second.date.localeCompare(first.date));
    const empty = document.getElementById("archive-empty");
    const table = document.getElementById("archive-table");
    const body = document.getElementById("archive-table-body");
    empty.style.display = records.length ? "none" : "block";
    table.style.display = records.length ? "table" : "none";
    body.innerHTML = records.map(record => {
        const actualTotal = record.actual ? Object.values(record.actual).reduce((sum, value) => sum + Number(value), 0) : null;
        const deviation = actualTotal === null ? "-" : `${(actualTotal - record.forecast.total).toFixed(2)} kWh`;
        return `<tr class="archive-row" onclick="showArchiveDetail('${record.date}')">
            <td>${new Date(`${record.date}T12:00:00`).toLocaleDateString('de-DE')}</td>
            <td>${getWeatherSymbol(record.weatherCode)} / ${Number(record.temperatureMax).toFixed(1)} °C</td>
            <td>${record.forecast.total.toFixed(2)} kWh</td>
            <td>${actualTotal === null ? "-" : `${actualTotal.toFixed(2)} kWh`}</td>
            <td>${deviation}</td>
        </tr>`;
    }).join("");
    const browser = document.getElementById("archive-browser");
    const cards = document.getElementById("archive-cards");
    browser.style.display = records.length ? "flex" : "none";
    cards.style.display = records.length ? "grid" : "none";
    const select = document.getElementById("archive-date-select");
    select.innerHTML = records.map(record => `<option value="${record.date}">${new Date(`${record.date}T12:00:00`).toLocaleDateString('de-DE')}</option>`).join("");
    if (records.length) showSelectedArchiveDay();
}

function getSelectedArchiveRecord() {
    const date = document.getElementById("archive-date-select").value;
    return loadArchive()[date];
}

function showSelectedArchiveDay() {
    const record = getSelectedArchiveRecord();
    if (!record) return;
    const irradianceProfiles = new Map(Object.entries(record.tiltedIrradiance).map(([key, values]) => [key, {
        time: values.map(value => value.time),
        global_tilted_irradiance: values.map(value => value.value)
    }]));
    const dailyData = {
        time: [record.date],
        weather_code: [record.weatherCode],
        temperature_2m_max: [record.temperatureMax],
        shortwave_radiation_sum: [record.horizontalRadiation]
    };
    renderDashboard(dailyData, anlagenKonfiguration, irradianceProfiles, "archive-cards", false);
}

function moveArchiveSelection(step) {
    const select = document.getElementById("archive-date-select");
    const nextIndex = select.selectedIndex + step;
    if (nextIndex >= 0 && nextIndex < select.options.length) {
        select.selectedIndex = nextIndex;
        showSelectedArchiveDay();
    }
}

function showPreviousArchiveDay() { moveArchiveSelection(1); }
function showNextArchiveDay() { moveArchiveSelection(-1); }

async function recalculateSelectedArchiveDay() {
    const record = getSelectedArchiveRecord();
    if (!record) return;
    const button = document.querySelector(".btn-recalculate");
    button.disabled = true;
    button.innerText = getText("archiveRecalculateBusy");
    try {
        const date = new Date(`${record.date}T12:00:00`);
        const coordinates = normalizeCoordinates(anlagenKonfiguration.coordinates ?? anlagenKonfiguration.koordinaten ?? {});
        const { latitude, longitude } = coordinates;
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&daily=weather_code,temperature_2m_max,shortwave_radiation_sum&timezone=Europe%2FBerlin&start_date=${record.date}&end_date=${record.date}`;
        const [response, irradianceProfiles] = await Promise.all([
            fetch(url),
            fetchTiltedIrradiance(anlagenKonfiguration, date, date)
        ]);
        if (!response.ok) throw new Error(`Wetterdaten konnten nicht geladen werden (HTTP ${response.status})`);
        const data = await response.json();
        const stringYields = calculateStringYields(record.date, anlagenKonfiguration, irradianceProfiles);
        const totalForecast = stringYields.reduce((sum, string) => sum + string.ertrag, 0);
        saveArchiveRecord(record.date, data.daily, 0, stringYields, totalForecast, irradianceProfiles);
        renderArchive();
        document.getElementById("archive-date-select").value = record.date;
        showSelectedArchiveDay();
        showArchiveDetail(record.date);
    } catch (error) {
        alert(`Neuberechnung fehlgeschlagen: ${error.message}`);
    } finally {
        button.disabled = false;
        button.innerText = getText("archiveRecalculate");
    }
}

function showArchiveDetail(date) {
    const record = loadArchive()[date];
    if (!record) return;
    const actualValues = record.actual ? Object.entries(record.actual).map(([id, value]) => `${id.replace("string_", getText("labels.string") + " ")}: ${Number(value).toFixed(2)} kWh`).join(", ") : getText("archiveDetailMissing");
    const irradiancePoints = Object.values(record.tiltedIrradiance).reduce((sum, values) => sum + values.length, 0);
    const detail = document.getElementById("archive-detail");
    detail.innerHTML = `<strong>${new Date(`${date}T12:00:00`).toLocaleDateString('de-DE')}</strong>: ${actualValues}<br>
        ${getText("weatherCode")} ${record.weatherCode}, ${getText("horizontalRadiation")} ${(Number(record.horizontalRadiation) / 3.6).toFixed(2)} kWh/m², ${getText("storedTiltedHours")}: ${irradiancePoints}`;
    detail.style.display = "block";
}

function exportArchive() {
    const blob = new Blob([JSON.stringify(loadArchive(), null, 2)], { type: "application/json" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `pv-archiv-${formatDate(new Date())}.json`;
    link.click();
    URL.revokeObjectURL(link.href);
}

function clearArchive() {
    if (!confirm(getText("confirmClearArchive"))) return;
    localStorage.removeItem(ARCHIVE_KEY);
    renderArchive();
    document.getElementById("archive-detail").style.display = "none";
}

// LocalStorage-Funktionen für Realwerte
function getActualValuesKey(dateStr) {
    return `pv_actual_values_${dateStr}`;
}

function getLegacyActualValuesKey(dateStr) {
    return `pv_actual_${dateStr}`;
}

function loadActualValues(dateStr) {
    const key = getActualValuesKey(dateStr);
    const legacyKey = getLegacyActualValuesKey(dateStr);
    const stored = localStorage.getItem(key) || localStorage.getItem(legacyKey);
    if (stored && !localStorage.getItem(key)) {
        localStorage.setItem(key, stored);
    }
    return stored ? JSON.parse(stored) : null;
}

function saveActualValuesData(dateStr, values) {
    const key = getActualValuesKey(dateStr);
    localStorage.setItem(key, JSON.stringify(values));
}

function openActualValuesModal(dateStr, cardIndex) {
    const modal = document.getElementById('actual-values-modal');
    const dateInput = document.getElementById('actual-date-input');
    const stringInputsDiv = document.getElementById('string-inputs');
    
    dateInput.value = dateStr;
    
    // Dynamisch die Eingabefelder für Strings generieren
    stringInputsDiv.innerHTML = '';
    if (anlagenKonfiguration) {
        const strings = anlagenKonfiguration.stringConfiguration ?? anlagenKonfiguration.string_aufteilung ?? [];
        strings.forEach((string) => {
            const stringId = string.stringId ?? string.string_id;
            const existingValues = loadActualValues(dateStr);
            const currentValue = existingValues && existingValues[`string_${stringId}`] ? existingValues[`string_${stringId}`] : '';
            
            const inputGroup = document.createElement('div');
            inputGroup.className = 'input-group';
            inputGroup.innerHTML = `
                <label>${string.name || `${getText("labels.string")} ${stringId}`} (${string.totalModuleCount ?? string.gesamt_module_anzahl} ${getText("labels.perModule")}, ${string.mainOrientation ?? string.haupt_ausrichtung ?? ""}):</label>
                <input type="number" step="0.01" id="string-${stringId}-input" value="${currentValue}" placeholder="${getText("exampleValue")}" />
            `;
            stringInputsDiv.appendChild(inputGroup);
        });
    }
    
    modal.classList.add('active');
}

function closeActualValuesModal() {
    const modal = document.getElementById('actual-values-modal');
    modal.classList.remove('active');
}

function saveActualValues() {
    const dateStr = document.getElementById('actual-date-input').value;
    if (!dateStr) {
        alert(getText('requiredDate'));
        return;
    }
    
    const values = {};
    if (anlagenKonfiguration) {
        const strings = anlagenKonfiguration.stringConfiguration ?? anlagenKonfiguration.string_aufteilung ?? [];
        strings.forEach(string => {
            const stringId = string.stringId ?? string.string_id;
            const inputValue = document.getElementById(`string-${stringId}-input`).value;
            if (inputValue) {
                values[`string_${stringId}`] = parseFloat(inputValue);
            }
        });
    }
    
    if (Object.keys(values).length === 0) {
        alert(getText('requiredValue'));
        return;
    }
    
    saveActualValuesData(dateStr, values);
    const archive = loadArchive();
    if (archive[dateStr]) {
        archive[dateStr].actual = values;
        localStorage.setItem(ARCHIVE_KEY, JSON.stringify(archive));
    }
    closeActualValuesModal();
    
    // Dashboard neu rendern, um die Realwerte anzuzeigen
    fetchAndCalculate();
}

function displayActualValuesForDay(dateStr, stringErtraege, sectionId) {
    const actualValues = loadActualValues(dateStr);
    const section = document.getElementById(sectionId);
    
    if (!actualValues) {
        section.className = 'actual-values empty';
        section.innerHTML = '';
        return;
    }
    
    section.className = 'actual-values has-data';
    
    let html = `<strong>${getText("realValuesComparison")}</strong><br>`;
    let totalActual = 0;
    let totalForecast = 0;
    
    const actualLines = stringErtraege.map(string => {
        const stringId = string.id;
        const forecastValue = string.ertrag;
        const actualValue = actualValues[`string_${stringId}`];
        
        if (actualValue !== undefined) {
            totalActual += actualValue;
            totalForecast += forecastValue;
            
            const deviation = actualValue - forecastValue;
            const deviationPercent = ((deviation / forecastValue) * 100).toFixed(1);
            const deviationClass = deviation >= 0 ? 'positive' : 'negative';
            const deviationSign = deviation >= 0 ? '+' : '';
            
            return `<div class="result-line">
                <span>String ${string.id}:</span>
                <span>${actualValue.toFixed(2)} kWh <span class="deviation ${deviationClass}">
                ${deviationSign}${deviation.toFixed(2)} kWh (${deviationSign}${deviationPercent}%)</span></span>
            </div>`;
        }
        return '';
    }).join('');
    
    html += actualLines;
    
    if (totalActual > 0) {
        const totalDeviation = totalActual - totalForecast;
        const totalDeviationPercent = ((totalDeviation / totalForecast) * 100).toFixed(1);
        const totalDeviationClass = totalDeviation >= 0 ? 'positive' : 'negative';
        const totalDeviationSign = totalDeviation >= 0 ? '+' : '';
        
        html += `<div class="result-line total-line">
            <span>${getText("labels.realTotal")}</span>
            <span>${totalActual.toFixed(2)} kWh <span class="deviation ${totalDeviationClass}">
            ${totalDeviationSign}${totalDeviation.toFixed(2)} kWh (${totalDeviationSign}${totalDeviationPercent}%)</span></span>
        </div>`;
    }
    
    section.innerHTML = html;
}
