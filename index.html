<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live PV-Forecast Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f3f5;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            position: relative;
            min-height: 52px;
            padding-top: 8px;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 5px;
            padding-right: 56px;
        }
        #language-switch {
            position: absolute;
            right: 0;
            top: 0;
            background: #2c3e50;
            color: white;
            border: none;
            border-radius: 999px;
            padding: 6px 10px;
            cursor: pointer;
            font-weight: bold;
            line-height: 1.2;
            box-shadow: 0 2px 6px rgba(44, 62, 80, 0.15);
        }
        .subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 30px;
        }
        .string-definitions {
            background: white;
            border-left: 4px solid #3498db;
            padding: 14px 18px;

        .string-definitions h2 {

        }
        .btn-toggle-definitions {
            background-color: #3498db;
            color: white;
            padding: 8px 14px;
            border: none;
            border-radius: 6px;

            margin-bottom: 12px;

        }

        }
        .configuration-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;

        }

            cursor: pointer;

        }
        .btn-apply-configuration {

        .btn-reset-configuration {
            background-color: #ecf0f1;

            border-top: 1px solid #eee;

        }

            color: #34495e;
        }
        .configuration-group {
            display: grid;
            grid-template-columns: minmax(180px, 1fr) repeat(3, minmax(95px, 130px));
            gap: 8px;

        }

            flex-direction: column;

        }

        .card {

        }
        .total-line {

        }
        .loading {
            text-align: center;
            font-size: 1.2em;
            color: #7f8c8d;
            padding: 40px;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;

        .modal.active {

        .modal-content {

            border-radius: 12px;

        .input-group {

        .input-group label {
            display: block;
            font-weight: bold;

        }
        .input-group input {
            width: 100%;
            padding: 8px;
            border: 1px solid #bdc3c7;

        .button-group {
            margin-top: 20px;

        }
        .button-group button {
            padding: 10px 20px;
            margin-left: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
        }
        .btn-save {
            background-color: #27ae60;
            color: white;
        }
        .btn-save:hover {
            background-color: #229954;
        }
        .btn-cancel {
            background-color: #95a5a6;
            color: white;
        }
        .btn-cancel:hover {
            background-color: #7f8c8d;
        }
        .btn-edit {
            background-color: #3498db;
            color: white;
            padding: 5px 10px;
            font-size: 0.85em;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-edit:hover {
            background-color: #2980b9;
        }
        .actual-values {
            background: #e8f8f5;
            padding: 10px;

        .actual-values.has-data {

        .actual-values.empty {

        .deviation.positive {
            background-color: #d5f4e6;
            color: #27ae60;
        }
        .deviation.negative {
            background-color: #fadbd8;
            color: #e74c3c;
        }
        .archive {
            background: white;

            border-radius: 12px;

        .archive-header {

            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;

        .archive h2 {

        .archive-actions {

        .btn-archive-clear { background: #ecf0f1; color: #34495e; }

        .archive-row { cursor: pointer; }

        .archive-detail { margin-top: 14px; padding: 12px; background: #f8f9fa; border-left: 3px solid #3498db; }

        .archive-browser {

<body>

<div class="container">
    <div class="header-row">
        <h1 id="app-title" data-default="☀️ Live PV-Ertragsprognose & Historie">☀️ Live PV-Ertragsprognose & Historie</h1>
        <button id="language-switch" type="button" onclick="toggleLanguage()" aria-label="Switch language">🌐 EN</button>
    </div>
    <div class="subtitle" id="anlage-subtitle" data-default="Echtzeitdaten via Open-Meteo API">Echtzeitdaten via Open-Meteo API</div>
    <button id="toggle-string-definitions" class="btn-toggle-definitions" type="button" style="display: none;" onclick="toggleStringDefinitions()">String-Konfiguration anzeigen</button>
    <div id="string-definitions" class="string-definitions" style="display: none;"></div>
    
    <div id="loading-text" class="loading" data-default="Lade Live-Wetterdaten und berechne Erträge...">Lade Live-Wetterdaten und berechne Erträge...</div>
    <div class="grid" id="dashboard-grid" style="display: none;"></div>

    <section class="archive" aria-labelledby="archive-title">
        <div class="archive-header">
            <h2 id="archive-title" data-default="Historisches Archiv">Historisches Archiv</h2>
            <div class="archive-actions">
                <button class="btn-archive-export" type="button" onclick="exportArchive()">Archiv exportieren</button>
                <button class="btn-archive-clear" type="button" onclick="clearArchive()">Archiv löschen</button>
            </div>
        </div>
        <p id="archive-empty" class="archive-empty" data-default="Noch keine historischen API-Daten gespeichert.">Noch keine historischen API-Daten gespeichert.</p>
        <div class="archive-table-wrapper">
            <table id="archive-table" style="display: none;">
                <thead><tr><th>Datum</th><th>Wetter</th><th>Prognose</th><th>Realwert</th><th>Abweichung</th></tr></thead>
                <tbody id="archive-table-body"></tbody>
            </table>
        </div>
        <div id="archive-detail" class="archive-detail" style="display: none;"></div>
        <div id="archive-browser" class="archive-browser" style="display: none;">
            <strong id="archive-browser-label">Archivkarte:</strong>
            <button id="archive-prev-button" type="button" onclick="showPreviousArchiveDay()" aria-label="Vorheriger Archivtag">&larr;</button>
            <select id="archive-date-select" onchange="showSelectedArchiveDay()" aria-label="Archivdatum"></select>
            <button id="archive-next-button" type="button" onclick="showNextArchiveDay()" aria-label="Nächster Archivtag">&rarr;</button>
            <button class="btn-recalculate" type="button" onclick="recalculateSelectedArchiveDay()">Prognose neu berechnen</button>
        </div>
        <div id="archive-cards" class="grid archive-cards" style="display: none;"></div>
    </section>
</div>

<!-- Modal für Realwerte eingeben -->
<div id="actual-values-modal" class="modal">
    <div class="modal-content">
        <span class="modal-close" onclick="closeActualValuesModal()">&times;</span>
        <div id="actual-values-title" class="modal-header">Realwerte eingeben</div>
        <div class="input-group">
            <label id="actual-date-label">Datum:</label>
            <input type="date" id="actual-date-input" />
        </div>
        <div id="string-inputs"></div>
        <div class="button-group">
            <button class="btn-cancel" onclick="closeActualValuesModal()">Abbrechen</button>
            <button class="btn-save" onclick="saveActualValues()">Speichern</button>
        </div>
    </div>
</div>

<script src="i18n.js"></script>
<script src="calc.js"></script>
<script>
let anlagenKonfiguration;
let anlagenKonfigurationOriginal;
const KONFIGURATIONS_URLEN = [
    "./anlage.json",
    "https://raw.githubusercontent.com/alizim/PV-Calculator/main/anlage.json"
];

const weekdayNames = ["Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"];
const labelNames = { "-2": getText("labels.dayBeforeYesterday"), "-1": getText("labels.yesterday"), "0": getText("labels.today"), "1": getText("labels.tomorrow"), "2": getText("labels.dayAfterTomorrow") };

// Hilfsfunktion zur Formatierung von Date-Objekten zu YYYY-MM-DD
function formatDate(date) {
    return date.toISOString().split('T')[0];
}

function getDateRange() {
    const heute = new Date();
    const vonDatum = new Date(heute);
    vonDatum.setDate(heute.getDate() - 2);
    const bisDatum = new Date(heute);
    bisDatum.setDate(heute.getDate() + 2);
    return { vonDatum, bisDatum };
}

async function fetchTiltedIrradiance(config, vonDatum, bisDatum) {
    const gruppen = config.string_aufteilung.flatMap(string => string.modul_gruppen_nach_neigung);
    const profile = new Map();
    const { latitude, longitude } = config.koordinaten;

    await Promise.all(gruppen.map(async gruppe => {
        const azimut = getAzimut(gruppe);

        const profileKey = `${gruppe.neigung_grad}:${azimut}`;
        if (profile.has(profileKey)) return;

        const url = `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&hourly=global_tilted_irradiance&tilt=${gruppe.neigung_grad}&azimuth=${azimut}&timezone=Europe%2FBerlin&start_date=${formatDate(vonDatum)}&end_date=${formatDate(bisDatum)}`;
        const response = await fetch(url);
        if (!response.ok) throw new Error(`Einstrahlungsprofil konnte nicht geladen werden (HTTP ${response.status})`);
        const data = await response.json();
        profile.set(profileKey, data.hourly);
    }));

    return profile;
}

async function fetchAndCalculate() {
    try {
        if (window.location.protocol === "file:") {
            throw new Error(getText("fileServerWarning"));
        }

        if (!anlagenKonfiguration) {
            let letzterKonfigurationsfehler;
            for (const konfigurationsUrl of KONFIGURATIONS_URLEN) {
                try {
                    const configUrl = new URL(konfigurationsUrl, document.baseURI);
                    const configResponse = await fetch(configUrl);
                    if (!configResponse.ok) throw new Error(`HTTP ${configResponse.status}`);
                    anlagenKonfiguration = await configResponse.json();
                    anlagenKonfigurationOriginal = structuredClone(anlagenKonfiguration);
                    const gespeicherteStrings = localStorage.getItem("pv_string_configuration");
                    if (gespeicherteStrings) {
                        anlagenKonfiguration.string_aufteilung = JSON.parse(gespeicherteStrings);
                    }
                    break;
                } catch (error) {
                    letzterKonfigurationsfehler = error;
                }
            }
            if (!anlagenKonfiguration) {
                throw new Error(`Anlagenkonfiguration konnte nicht geladen werden: ${letzterKonfigurationsfehler.message}`);
            }
        }

        const { vonDatum, bisDatum } = getDateRange();

        // Open-Meteo API URL für Historie + Vorhersage kombiniert
        const { latitude, longitude } = anlagenKonfiguration.koordinaten;
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&daily=weather_code,temperature_2m_max,shortwave_radiation_sum&timezone=Europe%2FBerlin&start_date=${formatDate(vonDatum)}&end_date=${formatDate(bisDatum)}`;

        const [response, irradianceProfiles] = await Promise.all([
            fetch(url),
            fetchTiltedIrradiance(anlagenKonfiguration, vonDatum, bisDatum)
        ]);
        if (!response.ok) throw new Error(`Wetterdaten konnten nicht geladen werden (HTTP ${response.status})`);
        const data = await response.json();

        if (!data.daily) throw new Error(getText("apiDataError"));

        const anlagenBeschreibung = anlagenKonfiguration.beschreibung || "Photovoltaikanlage";
        document.getElementById("anlage-subtitle").innerText =
            `${anlagenBeschreibung} | Standort: ${anlagenKonfiguration.standort} | ${anlagenKonfiguration.system_steckbrief.installierte_leistung_kwp.toFixed(2)} kWp`;
        renderStringDefinitions(anlagenKonfiguration);
        renderDashboard(data.daily, anlagenKonfiguration, irradianceProfiles);
        renderArchive();
        applyUiTranslations();
    } catch (error) {
        document.getElementById("loading-text").innerText = getText("errorLoading") + error.message;
    }
}

function getWeatherSymbol(code) {
    // WMO Weather Codes zu Emojis
    if (code <= 1) return getText("weather.sun");
    if (code <= 3) return getText("weather.variable");
    if (code >= 51) return getText("weather.rain");
    return getText("weather.cloud");
}

function renderStringDefinitions(config) {
    const definitions = document.getElementById("string-definitions");
    const entries = config.string_aufteilung.map(string => {
        const gruppen = string.modul_gruppen_nach_neigung.map(gruppe =>
            `${gruppe.anzahl_module}x ${gruppe.neigung_grad}° Neigung, ${gruppe.ausrichtung || `Azimut ${gruppe.azimut_grad}°`}`
        ).join("; ");
        const name = string.name || `String ${string.string_id}`;
        return `<div class="string-definition"><strong>String ${string.string_id}: ${name}</strong> - ${string.gesamt_module_anzahl} Module, ${string.haupt_ausrichtung || "Ausrichtung nicht angegeben"}<br><small>${gruppen}</small></div>`;
    }).join("");

    const editor = config.string_aufteilung.map(string => {
        const groups = string.modul_gruppen_nach_neigung.map((gruppe, groupIndex) => `
            <div class="configuration-group">
                <label>${gruppe.beschreibung || `Modulgruppe ${groupIndex + 1}`}
                    <small>${gruppe.anzahl_module} Module</small>
                </label>
                <label>Azimut (°)<input type="number" step="0.1" data-string-id="${string.string_id}" data-group-index="${groupIndex}" data-field="azimut_grad" value="${gruppe.azimut_grad}"></label>
                <label>Neigung (°)<input type="number" min="0" max="90" step="0.1" data-string-id="${string.string_id}" data-group-index="${groupIndex}" data-field="neigung_grad" value="${gruppe.neigung_grad}"></label>
                <label>Verlustfaktor<input type="number" min="0" max="1" step="0.01" data-string-id="${string.string_id}" data-group-index="${groupIndex}" data-field="verlustfaktor" value="${gruppe.verlustfaktor ?? string.verlustfaktor ?? config.verlustfaktor_standard}"></label>
            </div>`).join("");
        return `<section class="configuration-string"><h3>String ${string.string_id}: ${string.name || `String ${string.string_id}`}</h3>${groups}</section>`;
    }).join("");

    definitions.innerHTML = `<h2>${getText("stringConfigTitle")}</h2>
        <div class="configuration-actions">
            <button class="btn-apply-configuration" type="button" onclick="applyStringConfiguration()">${getText("applyChanges")}</button>
            <button class="btn-reset-configuration" type="button" onclick="resetStringConfiguration()">${getText("resetConfig")}</button>
        </div>
        ${editor}
        <p id="configuration-status" class="configuration-status" aria-live="polite"></p>
        <hr>${entries}`;
    document.getElementById("toggle-string-definitions").style.display = "inline-block";
    document.getElementById("toggle-string-definitions").dataset.visible = "false";
    document.getElementById("toggle-string-definitions").textContent = getText("toggleStrings");
}

function applyStringConfiguration() {
    const inputs = document.querySelectorAll("#string-definitions input[data-field]");
    const changedConfiguration = structuredClone(anlagenKonfiguration);

    for (const input of inputs) {
        const value = Number(input.value);
        if (!Number.isFinite(value)) {
            input.focus();
            alert(getText("invalidNumber"));
            return;
        }
        if (input.dataset.field === "verlustfaktor" && (value < 0 || value > 1)) {
            input.focus();
            alert(getText("invalidLossFactor"));
            return;
        }
        const string = changedConfiguration.string_aufteilung.find(item => String(item.string_id) === input.dataset.stringId);
        string.modul_gruppen_nach_neigung[Number(input.dataset.groupIndex)][input.dataset.field] = value;
    }

    anlagenKonfiguration = changedConfiguration;
    localStorage.setItem("pv_string_configuration", JSON.stringify(anlagenKonfiguration.string_aufteilung));
    document.getElementById("configuration-status").innerText = getText("changesLoading");
    fetchAndCalculate();
}

function resetStringConfiguration() {
    anlagenKonfiguration = structuredClone(anlagenKonfigurationOriginal);
    localStorage.removeItem("pv_string_configuration");
    renderStringDefinitions(anlagenKonfiguration);
    document.getElementById("configuration-status").innerText = getText("jsonRestored");
    fetchAndCalculate();
}

function toggleStringDefinitions() {
    const definitions = document.getElementById("string-definitions");
    const button = document.getElementById("toggle-string-definitions");
    const isVisible = definitions.style.display === "block";

    definitions.style.display = isVisible ? "none" : "block";
    button.dataset.visible = String(!isVisible);
    button.innerText = isVisible ? getText("toggleStrings") : getText("toggleStringsHide");
}

function renderDashboard(dailyData, config, irradianceProfiles, targetId = "dashboard-grid", persistArchive = true) {
    const grid = document.getElementById(targetId);
    grid.innerHTML = "";

    for (let i = 0; i < dailyData.time.length; i++) {
        const dayOffset = targetId === "dashboard-grid" ? i - 2 : null;
        
        const dateRaw = new Date(dailyData.time[i]);
        const dateStr = dateRaw.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' });
        const dayName = weekdayNames[dateRaw.getDay()];
        
        // Wetter- und Strahlungsdaten aus der API auflösen
        const tempMax = dailyData.temperature_2m_max[i];
        const radSum = dailyData.shortwave_radiation_sum[i] / 3.6; // Horizontale Globalstrahlung zur Information
        const weatherType = getWeatherSymbol(dailyData.weather_code[i]);
        const solarNoonElevation = getSolarNoonElevation(dateRaw, config.koordinaten.latitude);

        const stringErtraege = calculateStringYields(dailyData.time[i], config, irradianceProfiles);
        const gesamtErtrag = stringErtraege.reduce((summe, string) => summe + string.ertrag, 0);
        if (persistArchive) {
            saveArchiveRecord(dailyData.time[i], dailyData, i, stringErtraege, gesamtErtrag, irradianceProfiles);
        }
        const stringZeilen = stringErtraege.map(string =>
            `<div class="result-line"><span>${getText("labels.string")} ${string.id}:</span> <span>${string.ertrag.toFixed(2)} kWh</span></div>`
        ).join("");

        const isTodayClass = dayOffset === 0 ? 'today' : '';

        const card = document.createElement("div");
        card.className = `card ${isTodayClass}`;
        card.innerHTML = `
            <div class="date-title">${dayName}, ${dateStr}</div>
            <div class="day-tag">${dayOffset === null ? getText("labels.archive") : labelNames[dayOffset]}</div>
            
            <div class="weather-info">
                <strong>${weatherType}</strong><br>
                ${getText("labels.weatherInfo")} ${tempMax.toFixed(1)} °C<br>
                ${getText("labels.radiation")} ${radSum.toFixed(2)} kWh/m²<br>
                <span class="sun-position">${getText("labels.solarNoon")} ${solarNoonElevation.toFixed(1)}°</span>
            </div>

            <div class="results">
                ${stringZeilen}
                <div class="result-line total-line"><span>${getText("labels.forecastTotal")}</span> <span>${gesamtErtrag.toFixed(2)} kWh</span></div>
            </div>

            <div id="${targetId}-actual-section-${i}" class="actual-values empty"></div>
            
            <div style="margin-top: 15px; text-align: center;">
                <button class="btn-edit" onclick="openActualValuesModal('${dailyData.time[i]}', ${i})">${getText("labels.edit")}</button>
            </div>
        `;
        grid.appendChild(card);
        
        // Nach dem Einfügen: Realwerte laden und anzeigen
        displayActualValuesForDay(dailyData.time[i], stringErtraege, `${targetId}-actual-section-${i}`);
    }

    // Loader ausblenden, Grid anzeigen
    if (targetId === "dashboard-grid") {
        document.getElementById("loading-text").style.display = "none";
    }
    grid.style.display = "grid";
}

const ARCHIVE_KEY = "pv_historical_archive";

function loadArchive() {
    try {
        return JSON.parse(localStorage.getItem(ARCHIVE_KEY) || "{}");
    } catch (error) {
        return {};
    }
}

function saveArchiveRecord(dateStr, dailyData, index, stringYields, totalForecast, irradianceProfiles) {
    const archive = loadArchive();
    const date = dateStr.slice(0, 10);
    const irradiance = {};
    for (const [profileKey, hourly] of irradianceProfiles) {
        irradiance[profileKey] = hourly.time.reduce((values, timestamp, hourlyIndex) => {
            if (timestamp.startsWith(date)) {
                values.push({ time: timestamp, value: hourly.global_tilted_irradiance[hourlyIndex] || 0 });
            }
            return values;
        }, []);
    }
    archive[date] = {
        date,
        savedAt: new Date().toISOString(),
        weatherCode: dailyData.weather_code[index],
        temperatureMax: dailyData.temperature_2m_max[index],
        horizontalRadiation: dailyData.shortwave_radiation_sum[index],
        forecast: {
            total: totalForecast,
            strings: Object.fromEntries(stringYields.map(string => [`string_${string.id}`, string.ertrag]))
        },
        tiltedIrradiance: irradiance,
        actual: loadActualValues(date) || archive[date]?.actual || null
    };
    localStorage.setItem(ARCHIVE_KEY, JSON.stringify(archive));
}

function renderArchive() {
    const archive = loadArchive();
    const records = Object.values(archive).sort((first, second) => second.date.localeCompare(first.date));
    const empty = document.getElementById("archive-empty");
    const table = document.getElementById("archive-table");
    const body = document.getElementById("archive-table-body");
    empty.style.display = records.length ? "none" : "block";
    table.style.display = records.length ? "table" : "none";
    body.innerHTML = records.map(record => {
        const actualTotal = record.actual ? Object.values(record.actual).reduce((sum, value) => sum + Number(value), 0) : null;
        const deviation = actualTotal === null ? "-" : `${(actualTotal - record.forecast.total).toFixed(2)} kWh`;
        return `<tr class="archive-row" onclick="showArchiveDetail('${record.date}')">
            <td>${new Date(`${record.date}T12:00:00`).toLocaleDateString('de-DE')}</td>
            <td>${getWeatherSymbol(record.weatherCode)} / ${Number(record.temperatureMax).toFixed(1)} °C</td>
            <td>${record.forecast.total.toFixed(2)} kWh</td>
            <td>${actualTotal === null ? "-" : `${actualTotal.toFixed(2)} kWh`}</td>
            <td>${deviation}</td>
        </tr>`;
    }).join("");
    const browser = document.getElementById("archive-browser");
    const cards = document.getElementById("archive-cards");
    browser.style.display = records.length ? "flex" : "none";
    cards.style.display = records.length ? "grid" : "none";
    const select = document.getElementById("archive-date-select");
    select.innerHTML = records.map(record => `<option value="${record.date}">${new Date(`${record.date}T12:00:00`).toLocaleDateString('de-DE')}</option>`).join("");
    if (records.length) showSelectedArchiveDay();
}

function getSelectedArchiveRecord() {
    const date = document.getElementById("archive-date-select").value;
    return loadArchive()[date];
}

function showSelectedArchiveDay() {
    const record = getSelectedArchiveRecord();
    if (!record) return;
    const irradianceProfiles = new Map(Object.entries(record.tiltedIrradiance).map(([key, values]) => [key, {
        time: values.map(value => value.time),
        global_tilted_irradiance: values.map(value => value.value)
    }]));
    const dailyData = {
        time: [record.date],
        weather_code: [record.weatherCode],
        temperature_2m_max: [record.temperatureMax],
        shortwave_radiation_sum: [record.horizontalRadiation]
    };
    renderDashboard(dailyData, anlagenKonfiguration, irradianceProfiles, "archive-cards", false);
}

function moveArchiveSelection(step) {
    const select = document.getElementById("archive-date-select");
    const nextIndex = select.selectedIndex + step;
    if (nextIndex >= 0 && nextIndex < select.options.length) {
        select.selectedIndex = nextIndex;
        showSelectedArchiveDay();
    }
}

function showPreviousArchiveDay() { moveArchiveSelection(1); }
function showNextArchiveDay() { moveArchiveSelection(-1); }

async function recalculateSelectedArchiveDay() {
    const record = getSelectedArchiveRecord();
    if (!record) return;
    const button = document.querySelector(".btn-recalculate");
    button.disabled = true;
    button.innerText = getText("archiveRecalculateBusy");
    try {
        const date = new Date(`${record.date}T12:00:00`);
        const { latitude, longitude } = anlagenKonfiguration.koordinaten;
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&daily=weather_code,temperature_2m_max,shortwave_radiation_sum&timezone=Europe%2FBerlin&start_date=${record.date}&end_date=${record.date}`;
        const [response, irradianceProfiles] = await Promise.all([
            fetch(url),
            fetchTiltedIrradiance(anlagenKonfiguration, date, date)
        ]);
        if (!response.ok) throw new Error(`Wetterdaten konnten nicht geladen werden (HTTP ${response.status})`);
        const data = await response.json();
        const stringYields = calculateStringYields(record.date, anlagenKonfiguration, irradianceProfiles);
        const totalForecast = stringYields.reduce((sum, string) => sum + string.ertrag, 0);
        saveArchiveRecord(record.date, data.daily, 0, stringYields, totalForecast, irradianceProfiles);
        renderArchive();
        document.getElementById("archive-date-select").value = record.date;
        showSelectedArchiveDay();
        showArchiveDetail(record.date);
    } catch (error) {
        alert(`Neuberechnung fehlgeschlagen: ${error.message}`);
    } finally {
        button.disabled = false;
        button.innerText = getText("archiveRecalculate");
    }
}

function showArchiveDetail(date) {
    const record = loadArchive()[date];
    if (!record) return;
    const actualValues = record.actual ? Object.entries(record.actual).map(([id, value]) => `${id.replace("string_", getText("labels.string") + " ")}: ${Number(value).toFixed(2)} kWh`).join(", ") : getText("archiveDetailMissing");
    const irradiancePoints = Object.values(record.tiltedIrradiance).reduce((sum, values) => sum + values.length, 0);
    const detail = document.getElementById("archive-detail");
    detail.innerHTML = `<strong>${new Date(`${date}T12:00:00`).toLocaleDateString('de-DE')}</strong>: ${actualValues}<br>
        ${getText("weatherCode")} ${record.weatherCode}, ${getText("horizontalRadiation")} ${(Number(record.horizontalRadiation) / 3.6).toFixed(2)} kWh/m², ${getText("storedTiltedHours")}: ${irradiancePoints}`;
    detail.style.display = "block";
}

function exportArchive() {
    const blob = new Blob([JSON.stringify(loadArchive(), null, 2)], { type: "application/json" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `pv-archiv-${formatDate(new Date())}.json`;
    link.click();
    URL.revokeObjectURL(link.href);
}

function clearArchive() {
    if (!confirm(getText("confirmClearArchive"))) return;
    localStorage.removeItem(ARCHIVE_KEY);
    renderArchive();
    document.getElementById("archive-detail").style.display = "none";
}

// LocalStorage-Funktionen für Realwerte
function getActualValuesKey(dateStr) {
    return `pv_actual_${dateStr}`;
}

function loadActualValues(dateStr) {
    const key = getActualValuesKey(dateStr);
    const stored = localStorage.getItem(key);
    return stored ? JSON.parse(stored) : null;
}

function saveActualValuesData(dateStr, values) {
    const key = getActualValuesKey(dateStr);
    localStorage.setItem(key, JSON.stringify(values));
}

function openActualValuesModal(dateStr, cardIndex) {
    const modal = document.getElementById('actual-values-modal');
    const dateInput = document.getElementById('actual-date-input');
    const stringInputsDiv = document.getElementById('string-inputs');
    
    dateInput.value = dateStr;
    
    // Dynamisch die Eingabefelder für Strings generieren
    stringInputsDiv.innerHTML = '';
    if (anlagenKonfiguration) {
        anlagenKonfiguration.string_aufteilung.forEach((string, index) => {
            const stringId = string.string_id;
            const existingValues = loadActualValues(dateStr);
            const currentValue = existingValues && existingValues[`string_${stringId}`] ? existingValues[`string_${stringId}`] : '';
            
            const inputGroup = document.createElement('div');
            inputGroup.className = 'input-group';
            inputGroup.innerHTML = `
                <label>${string.name || `${getText("labels.string")} ${stringId}`} (${string.gesamt_module_anzahl} ${getText("labels.perModule")}, ${string.haupt_ausrichtung}):</label>
                <input type="number" step="0.01" id="string-${stringId}-input" value="${currentValue}" placeholder="${getText("exampleValue")}" />
            `;
            stringInputsDiv.appendChild(inputGroup);
        });
    }
    
    modal.classList.add('active');
}

function closeActualValuesModal() {
    const modal = document.getElementById('actual-values-modal');
    modal.classList.remove('active');
}

function saveActualValues() {
    const dateStr = document.getElementById('actual-date-input').value;
    if (!dateStr) {
        alert(getText('requiredDate'));
        return;
    }
    
    const values = {};
    if (anlagenKonfiguration) {
        anlagenKonfiguration.string_aufteilung.forEach(string => {
            const stringId = string.string_id;
            const inputValue = document.getElementById(`string-${stringId}-input`).value;
            if (inputValue) {
                values[`string_${stringId}`] = parseFloat(inputValue);
            }
        });
    }
    
    if (Object.keys(values).length === 0) {
        alert(getText('requiredValue'));
        return;
    }
    
    saveActualValuesData(dateStr, values);
    const archive = loadArchive();
    if (archive[dateStr]) {
        archive[dateStr].actual = values;
        localStorage.setItem(ARCHIVE_KEY, JSON.stringify(archive));
    }
    closeActualValuesModal();
    
    // Dashboard neu rendern, um die Realwerte anzuzeigen
    fetchAndCalculate();
}

function displayActualValuesForDay(dateStr, stringErtraege, sectionId) {
    const actualValues = loadActualValues(dateStr);
    const section = document.getElementById(sectionId);
    
    if (!actualValues) {
        section.className = 'actual-values empty';
        section.innerHTML = '';
        return;
    }
    
    section.className = 'actual-values has-data';
    
    let html = `<strong>${getText("realValuesComparison")}</strong><br>`;
    let totalActual = 0;
    let totalForecast = 0;
    
    const actualLines = stringErtraege.map(string => {
        const stringId = string.id;
        const forecastValue = string.ertrag;
        const actualValue = actualValues[`string_${stringId}`];
        
        if (actualValue !== undefined) {
            totalActual += actualValue;
            totalForecast += forecastValue;
            
            const deviation = actualValue - forecastValue;
            const deviationPercent = ((deviation / forecastValue) * 100).toFixed(1);
            const deviationClass = deviation >= 0 ? 'positive' : 'negative';
            const deviationSign = deviation >= 0 ? '+' : '';
            
            return `<div class="result-line">
                <span>String ${string.id}:</span>
                <span>${actualValue.toFixed(2)} kWh <span class="deviation ${deviationClass}">
                ${deviationSign}${deviation.toFixed(2)} kWh (${deviationSign}${deviationPercent}%)</span></span>
            </div>`;
        }
        return '';
    }).join('');
    
    html += actualLines;
    
    if (totalActual > 0) {
        const totalDeviation = totalActual - totalForecast;
        const totalDeviationPercent = ((totalDeviation / totalForecast) * 100).toFixed(1);
        const totalDeviationClass = totalDeviation >= 0 ? 'positive' : 'negative';
        const totalDeviationSign = totalDeviation >= 0 ? '+' : '';
        
        html += `<div class="result-line total-line">
            <span>${getText("labels.realTotal")}</span>
            <span>${totalActual.toFixed(2)} kWh <span class="deviation ${totalDeviationClass}">
            ${totalDeviationSign}${totalDeviation.toFixed(2)} kWh (${totalDeviationSign}${totalDeviationPercent}%)</span></span>
        </div>`;
    }
    
    section.innerHTML = html;
}

// Modal-Closes bei Klick außerhalb
window.onclick = function(event) {
    const modal = document.getElementById('actual-values-modal');
    if (event.target === modal) {
        modal.classList.remove('active');
    }
};

// Beim Start die API abfragen
window.onload = fetchAndCalculate;
