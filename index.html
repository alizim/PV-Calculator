<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live PV-Forecast Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f3f5;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 30px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-top: 5px solid #bdc3c7;
            position: relative;
        }
        .card.today {
            border-top-color: #f1c40f;
            background-color: #fffdf2;
        }
        .date-title {
            font-size: 1.1em;
            font-weight: bold;
            color: #34495e;
        }
        .day-tag {
            display: inline-block;
            font-size: 0.75em;
            padding: 2px 6px;
            border-radius: 4px;
            background: #e0e0e0;
            margin-bottom: 12px;
            font-weight: bold;
        }
        .card.today .day-tag {
            background: #f1c40f;
            color: white;
        }
        .weather-info {
            background: #f8f9fa;
            padding: 8px;
            border-radius: 6px;
            font-size: 0.85em;
            margin-bottom: 15px;
            border-left: 3px solid #3498db;
        }
        .results {
            border-top: 1px solid #eee;
            padding-top: 10px;
        }
        .result-line {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 0.95em;
        }
        .total-line {
            font-weight: bold;
            color: #27ae60;
            border-top: 1px dashed #ddd;
            padding-top: 6px;
            margin-top: 6px;
        }
        .loading {
            text-align: center;
            font-size: 1.2em;
            color: #7f8c8d;
            padding: 40px;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
        }
        .modal.active {
            display: block;
        }
        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 30px;
            border: 1px solid #888;
            border-radius: 12px;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        .modal-header {
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 20px;
            color: #2c3e50;
        }
        .modal-close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }
        .modal-close:hover {
            color: black;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #34495e;
        }
        .input-group input {
            width: 100%;
            padding: 8px;
            border: 1px solid #bdc3c7;
            border-radius: 6px;
            font-size: 1em;
            box-sizing: border-box;
        }
        .button-group {
            margin-top: 20px;
            text-align: right;
        }
        .button-group button {
            padding: 10px 20px;
            margin-left: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
        }
        .btn-save {
            background-color: #27ae60;
            color: white;
        }
        .btn-save:hover {
            background-color: #229954;
        }
        .btn-cancel {
            background-color: #95a5a6;
            color: white;
        }
        .btn-cancel:hover {
            background-color: #7f8c8d;
        }
        .btn-edit {
            background-color: #3498db;
            color: white;
            padding: 5px 10px;
            font-size: 0.85em;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-edit:hover {
            background-color: #2980b9;
        }
        .actual-values {
            background: #e8f8f5;
            padding: 10px;
            border-radius: 6px;
            border-left: 4px solid #27ae60;
            margin-bottom: 10px;
        }
        .actual-values.has-data {
            display: block;
        }
        .actual-values.empty {
            display: none;
        }
        .deviation {
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 3px;
        }
        .deviation.positive {
            background-color: #d5f4e6;
            color: #27ae60;
        }
        .deviation.negative {
            background-color: #fadbd8;
            color: #e74c3c;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>☀️ Live PV-Ertragsprognose & Historie</h1>
    <div class="subtitle" id="anlage-subtitle">Echtzeitdaten via Open-Meteo API</div>
    
    <div id="loading-text" class="loading">Lade Live-Wetterdaten und berechne Erträge...</div>
    <div class="grid" id="dashboard-grid" style="display: none;"></div>
</div>

<!-- Modal für Realwerte eingeben -->
<div id="actual-values-modal" class="modal">
    <div class="modal-content">
        <span class="modal-close" onclick="closeActualValuesModal()">&times;</span>
        <div class="modal-header">Realwerte eingeben</div>
        <div class="input-group">
            <label>Datum:</label>
            <input type="date" id="actual-date-input" />
        </div>
        <div id="string-inputs"></div>
        <div class="button-group">
            <button class="btn-cancel" onclick="closeActualValuesModal()">Abbrechen</button>
            <button class="btn-save" onclick="saveActualValues()">Speichern</button>
        </div>
    </div>
</div>

<script>
// Standortsdaten für Norderstedt
const LAT = 53.7065;
const LON = 10.0101;

let anlagenKonfiguration;
const SYSTEMVERLUSTFAKTOR = 0.85;
const KONFIGURATIONS_URLEN = [
    "./anlage.json",
    "https://raw.githubusercontent.com/alizim/PV-Calculator/main/anlage.json"
];

const weekdayNames = ["Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"];
const labelNames = { "-2": "Vorgestern", "-1": "Gestern", "0": "Heute", "1": "Morgen", "2": "Übermorgen" };

const AUSRICHTUNG_AZIMUT = {
    "Nordnordwest (NNW)": 163.5,
    "Südsüdost (SSO)": -16.5,
    "Ost-Außenwand (Klinkerwand)": -90
};

// Hilfsfunktion zur Formatierung von Date-Objekten zu YYYY-MM-DD
function formatDate(date) {
    return date.toISOString().split('T')[0];
}

function getDateRange() {
    const heute = new Date();
    const vonDatum = new Date(heute);
    vonDatum.setDate(heute.getDate() - 2);
    const bisDatum = new Date(heute);
    bisDatum.setDate(heute.getDate() + 2);
    return { vonDatum, bisDatum };
}

async function fetchTiltedIrradiance(config, vonDatum, bisDatum) {
    const gruppen = config.string_aufteilung.flatMap(string => string.modul_gruppen_nach_neigung);
    const profile = new Map();

    await Promise.all(gruppen.map(async gruppe => {
        const azimut = AUSRICHTUNG_AZIMUT[gruppe.ausrichtung];
        if (azimut === undefined) throw new Error(`Unbekannte Ausrichtung: ${gruppe.ausrichtung}`);

        const profileKey = `${gruppe.neigung_grad}:${azimut}`;
        if (profile.has(profileKey)) return;

        const url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&hourly=global_tilted_irradiance&tilt=${gruppe.neigung_grad}&azimuth=${azimut}&timezone=Europe%2FBerlin&start_date=${formatDate(vonDatum)}&end_date=${formatDate(bisDatum)}`;
        const response = await fetch(url);
        if (!response.ok) throw new Error(`Einstrahlungsprofil konnte nicht geladen werden (HTTP ${response.status})`);
        const data = await response.json();
        profile.set(profileKey, data.hourly);
    }));

    return profile;
}

function getDailyIrradiance(hourlyData, date) {
    const day = date.slice(0, 10);
    return hourlyData.time.reduce((summe, timestamp, index) =>
        timestamp.startsWith(day) ? summe + (hourlyData.global_tilted_irradiance[index] || 0) : summe, 0
    ) / 1000;
}

async function fetchAndCalculate() {
    try {
        if (window.location.protocol === "file:") {
            throw new Error("Bitte index.html über einen Webserver öffnen, damit anlage.json geladen werden kann");
        }

        let letzterKonfigurationsfehler;
        for (const konfigurationsUrl of KONFIGURATIONS_URLEN) {
            try {
                const configUrl = new URL(konfigurationsUrl, document.baseURI);
                const configResponse = await fetch(configUrl);
                if (!configResponse.ok) throw new Error(`HTTP ${configResponse.status}`);
                anlagenKonfiguration = await configResponse.json();
                break;
            } catch (error) {
                letzterKonfigurationsfehler = error;
            }
        }
        if (!anlagenKonfiguration) {
            throw new Error(`Anlagenkonfiguration konnte nicht geladen werden: ${letzterKonfigurationsfehler.message}`);
        }

        const { vonDatum, bisDatum } = getDateRange();

        // Open-Meteo API URL für Historie + Vorhersage kombiniert
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&daily=weather_code,temperature_2m_max,shortwave_radiation_sum&timezone=Europe%2FBerlin&start_date=${formatDate(vonDatum)}&end_date=${formatDate(bisDatum)}`;

        const [response, irradianceProfiles] = await Promise.all([
            fetch(url),
            fetchTiltedIrradiance(anlagenKonfiguration, vonDatum, bisDatum)
        ]);
        if (!response.ok) throw new Error(`Wetterdaten konnten nicht geladen werden (HTTP ${response.status})`);
        const data = await response.json();

        if (!data.daily) throw new Error("Fehler beim Laden der API-Daten");

        document.getElementById("anlage-subtitle").innerText =
            `Standort: ${anlagenKonfiguration.standort} | ${anlagenKonfiguration.system_steckbrief.installierte_leistung_kwp.toFixed(2)} kWp | Echtzeitdaten via Open-Meteo API`;
        renderDashboard(data.daily, anlagenKonfiguration, irradianceProfiles);
    } catch (error) {
        document.getElementById("loading-text").innerText = "Fehler beim Laden der Live-Daten: " + error.message;
    }
}

function getWeatherSymbol(code) {
    // WMO Weather Codes zu Emojis
    if (code <= 1) return "☀️ Sonne";
    if (code <= 3) return "🌗 Wechselhaft";
    if (code >= 51) return "🌧️ Regen";
    return "☁️ Bewölkt";
}

function renderDashboard(dailyData, config, irradianceProfiles) {
    const grid = document.getElementById("dashboard-grid");
    grid.innerHTML = "";

    // Schleife über die 5 empfangenen Tage (-2 bis +2)
    for (let i = 0; i < 5; i++) {
        const dayOffset = i - 2; // Wandelt 0..4 um in -2..2
        
        const dateRaw = new Date(dailyData.time[i]);
        const dateStr = dateRaw.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' });
        const dayName = weekdayNames[dateRaw.getDay()];
        
        // Wetter- und Strahlungsdaten aus der API auflösen
        const tempMax = dailyData.temperature_2m_max[i];
        const radSum = dailyData.shortwave_radiation_sum[i] / 3.6; // Horizontale Globalstrahlung zur Information
        const weatherType = getWeatherSymbol(dailyData.weather_code[i]);

        // Jede Modulgruppe wird mit ihrer eigenen geneigten Einstrahlung berechnet.
        const modulLeistung_kWp = config.system_steckbrief.module.leistung_pro_modul_w / 1000;
        const stringErtraege = config.string_aufteilung.map(string => {
            // String-spezifischer Verlustfaktor oder Standard verwenden
            const stringVerlustfaktor = string.verlustfaktor !== undefined ? string.verlustfaktor : SYSTEMVERLUSTFAKTOR;
            
            const gruppen = string.modul_gruppen_nach_neigung.map(gruppe => {
                const leistung_kWp = gruppe.anzahl_module * modulLeistung_kWp;
                const azimut = AUSRICHTUNG_AZIMUT[gruppe.ausrichtung];
                const irradiance = getDailyIrradiance(
                    irradianceProfiles.get(`${gruppe.neigung_grad}:${azimut}`),
                    dailyData.time[i]
                );
                return {
                    ...gruppe,
                    ertrag: irradiance * leistung_kWp *
                        (gruppe.verlustfaktor !== undefined ? gruppe.verlustfaktor : stringVerlustfaktor)
                };
            });
            return {
                id: string.string_id,
                name: string.name || `String ${string.string_id}`,
                ausrichtung: string.haupt_ausrichtung,
                module: string.gesamt_module_anzahl,
                neigungen: gruppen.map(gruppe => `${gruppe.anzahl_module}x ${gruppe.neigung_grad}°`).join(" + "),
                ertrag: gruppen.reduce((summe, gruppe) => summe + gruppe.ertrag, 0),
                gruppen
            };
        });
        const gesamtErtrag = stringErtraege.reduce((summe, string) => summe + string.ertrag, 0);
        const stringZeilen = stringErtraege.map(string =>
            `<div class="result-line"><span>${string.name} (${string.module} Module, ${string.ausrichtung}, ${string.neigungen}):</span> <span>${string.ertrag.toFixed(2)} kWh</span></div>`
        ).join("");

        const isTodayClass = dayOffset === 0 ? 'today' : '';

        const card = document.createElement("div");
        card.className = `card ${isTodayClass}`;
        card.innerHTML = `
            <div class="date-title">${dayName}, ${dateStr}</div>
            <div class="day-tag">${labelNames[dayOffset]}</div>
            
            <div class="weather-info">
                <strong>${weatherType}</strong><br>
                🌡️ Max: ${tempMax.toFixed(1)} °C<br>
                🌤️ Strahlung: ${radSum.toFixed(2)} kWh/m²
            </div>

            <div class="results">
                ${stringZeilen}
                <div class="result-line total-line"><span>Prognose Gesamt:</span> <span>${gesamtErtrag.toFixed(2)} kWh</span></div>
            </div>

            <div id="actual-section-${i}" class="actual-values empty"></div>
            
            <div style="margin-top: 15px; text-align: center;">
                <button class="btn-edit" onclick="openActualValuesModal('${dailyData.time[i]}', ${i})">Realwerte eingeben</button>
            </div>
        `;
        grid.appendChild(card);
        
        // Nach dem Einfügen: Realwerte laden und anzeigen
        displayActualValuesForDay(dailyData.time[i], stringErtraege, i);
    }

    // Loader ausblenden, Grid anzeigen
    document.getElementById("loading-text").style.display = "none";
    grid.style.display = "grid";
}

// LocalStorage-Funktionen für Realwerte
function getActualValuesKey(dateStr) {
    return `pv_actual_${dateStr}`;
}

function loadActualValues(dateStr) {
    const key = getActualValuesKey(dateStr);
    const stored = localStorage.getItem(key);
    return stored ? JSON.parse(stored) : null;
}

function saveActualValuesData(dateStr, values) {
    const key = getActualValuesKey(dateStr);
    localStorage.setItem(key, JSON.stringify(values));
}

function openActualValuesModal(dateStr, cardIndex) {
    const modal = document.getElementById('actual-values-modal');
    const dateInput = document.getElementById('actual-date-input');
    const stringInputsDiv = document.getElementById('string-inputs');
    
    dateInput.value = dateStr;
    
    // Dynamisch die Eingabefelder für Strings generieren
    stringInputsDiv.innerHTML = '';
    if (anlagenKonfiguration) {
        anlagenKonfiguration.string_aufteilung.forEach((string, index) => {
            const stringId = string.string_id;
            const existingValues = loadActualValues(dateStr);
            const currentValue = existingValues && existingValues[`string_${stringId}`] ? existingValues[`string_${stringId}`] : '';
            
            const inputGroup = document.createElement('div');
            inputGroup.className = 'input-group';
            inputGroup.innerHTML = `
                <label>${string.name || `String ${stringId}`} (${string.gesamt_module_anzahl} Module, ${string.haupt_ausrichtung}):</label>
                <input type="number" step="0.01" id="string-${stringId}-input" value="${currentValue}" placeholder="z.B. 22.85" />
            `;
            stringInputsDiv.appendChild(inputGroup);
        });
    }
    
    modal.classList.add('active');
}

function closeActualValuesModal() {
    const modal = document.getElementById('actual-values-modal');
    modal.classList.remove('active');
}

function saveActualValues() {
    const dateStr = document.getElementById('actual-date-input').value;
    if (!dateStr) {
        alert('Bitte ein Datum auswählen');
        return;
    }
    
    const values = {};
    if (anlagenKonfiguration) {
        anlagenKonfiguration.string_aufteilung.forEach(string => {
            const stringId = string.string_id;
            const inputValue = document.getElementById(`string-${stringId}-input`).value;
            if (inputValue) {
                values[`string_${stringId}`] = parseFloat(inputValue);
            }
        });
    }
    
    if (Object.keys(values).length === 0) {
        alert('Bitte mindestens einen Wert eingeben');
        return;
    }
    
    saveActualValuesData(dateStr, values);
    closeActualValuesModal();
    
    // Dashboard neu rendern, um die Realwerte anzuzeigen
    fetchAndCalculate();
}

function displayActualValuesForDay(dateStr, stringErtraege, cardIndex) {
    const actualValues = loadActualValues(dateStr);
    const section = document.getElementById(`actual-section-${cardIndex}`);
    
    if (!actualValues) {
        section.className = 'actual-values empty';
        section.innerHTML = '';
        return;
    }
    
    section.className = 'actual-values has-data';
    
    let html = '<strong>📊 Realwerte & Vergleich:</strong><br>';
    let totalActual = 0;
    let totalForecast = 0;
    
    const actualLines = stringErtraege.map(string => {
        const stringId = string.id;
        const forecastValue = string.ertrag;
        const actualValue = actualValues[`string_${stringId}`];
        
        if (actualValue !== undefined) {
            totalActual += actualValue;
            totalForecast += forecastValue;
            
            const deviation = actualValue - forecastValue;
            const deviationPercent = ((deviation / forecastValue) * 100).toFixed(1);
            const deviationClass = deviation >= 0 ? 'positive' : 'negative';
            const deviationSign = deviation >= 0 ? '+' : '';
            
            return `<div class="result-line">
                <span>${string.name}:</span>
                <span>${actualValue.toFixed(2)} kWh <span class="deviation ${deviationClass}">
                ${deviationSign}${deviation.toFixed(2)} kWh (${deviationSign}${deviationPercent}%)</span></span>
            </div>`;
        }
        return '';
    }).join('');
    
    html += actualLines;
    
    if (totalActual > 0) {
        const totalDeviation = totalActual - totalForecast;
        const totalDeviationPercent = ((totalDeviation / totalForecast) * 100).toFixed(1);
        const totalDeviationClass = totalDeviation >= 0 ? 'positive' : 'negative';
        const totalDeviationSign = totalDeviation >= 0 ? '+' : '';
        
        html += `<div class="result-line total-line">
            <span>Realwert Gesamt:</span>
            <span>${totalActual.toFixed(2)} kWh <span class="deviation ${totalDeviationClass}">
            ${totalDeviationSign}${totalDeviation.toFixed(2)} kWh (${totalDeviationSign}${totalDeviationPercent}%)</span></span>
        </div>`;
    }
    
    section.innerHTML = html;
}

// Modal-Closes bei Klick außerhalb
window.onclick = function(event) {
    const modal = document.getElementById('actual-values-modal');
    if (event.target === modal) {
        modal.classList.remove('active');
    }
};

// Beim Start die API abfragen
window.onload = fetchAndCalculate;
</script>

</body>
</html>
